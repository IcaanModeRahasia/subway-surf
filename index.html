<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Subway Runner 3D - Anime Ultimate Online</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',Roboto,sans-serif;user-select:none}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10}
  .screen.active{display:flex}
  #gameScreen{display:none}
  #gameScreen.active{display:block}
  #authScreen{background:linear-gradient(160deg,#0f0f23,#16213e,#0f3460)}
  .auth-box{background:rgba(255,255,255,.07);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:32px 28px;width:90%;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:92vh;overflow-y:auto}
  .auth-box h1{font-size:22px;margin-bottom:4px;background:linear-gradient(90deg,#ff6b00,#ffcc00,#ff6b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200%;animation:shine 3s infinite}
  @keyframes shine{0%,100%{background-position:0%}50%{background-position:100%}}
  .subtitle{color:#8899aa;font-size:12px;margin-bottom:20px}
  .auth-box input{width:100%;padding:12px 16px;margin-bottom:10px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:14px;outline:none}
  .auth-box input:focus{border-color:#ff8800;box-shadow:0 0 0 3px rgba(255,136,0,.15)}
  .auth-btns{display:flex;gap:10px;margin-top:6px}
  .btn{flex:1;padding:13px 18px;border:none;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.15)}
  .btn:hover{background:rgba(255,255,255,.18);transform:translateY(-2px)}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(135deg,#ff6b00,#ffaa00);border:none;box-shadow:0 8px 20px rgba(255,120,0,.35)}
  .msg{margin-top:14px;font-size:12px;min-height:16px}
  .msg.err{color:#ff6b6b}.msg.ok{color:#2ecc71}
  #menuScreen{background:linear-gradient(180deg,#0a0a15,#1a1a2e,#2c1e4e)}
  .menu-top{position:absolute;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center}
  .user-info{display:flex;align-items:center;gap:10px}
  .avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid rgba(255,255,255,.3);font-weight:900;color:#fff}
  .username{color:#fff;font-weight:600;font-size:14px}
  .coins-display{color:#ffd700;font-size:13px;font-weight:600}
  .hs-display{color:#8899aa;font-size:13px;background:rgba(0,0,0,.3);padding:8px 14px;border-radius:20px}
  .menu-center{text-align:center;display:flex;flex-direction:column;gap:10px;width:90%;max-width:340px}
  .title3d{font-size:24px;font-weight:900;margin-bottom:14px;letter-spacing:2px;background:linear-gradient(180deg,#ffcc00,#ff6b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 12px rgba(255,120,0,.5))}
  .play-btn{font-size:20px;padding:18px}
  .resume-btn{background:linear-gradient(135deg,#f39c12,#e67e22);border:none}
  .hidden{display:none!important}
  #gameScreen{position:fixed;inset:0;z-index:5}
  #gameScreen canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:6}
  .hud-left{display:flex;flex-direction:column;gap:6px}

  .pause-btn{pointer-events:auto;width:48px;height:48px;border-radius:12px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:22px;cursor:pointer}
  .status-bar{position:absolute;top:130px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;z-index:6;pointer-events:none}
  .status-pill{padding:6px 14px;border-radius:20px;font-weight:700;font-size:13px;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.4)}
  .pill-boots{background:linear-gradient(135deg,#ff9500,#ff6b00)}
  .pill-wings{background:linear-gradient(135deg,#00d2ff,#0066ff)}
  .pill-board{background:linear-gradient(135deg,#00ff88,#00aa55)}
  .pill-skill{background:linear-gradient(135deg,#cc00ff,#6600cc)}
  .skill-btn{position:absolute;bottom:100px;right:20px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,#cc00ff,#6600cc);border:3px solid rgba(255,255,255,.4);color:#fff;font-size:11px;font-weight:900;cursor:pointer;box-shadow:0 6px 20px rgba(204,0,255,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:7}
  .skill-btn:disabled{background:radial-gradient(circle,#444,#222);box-shadow:none;opacity:.5}
  .skill-btn .skill-icon{font-size:24px;margin-bottom:2px}
  .skill-btn .skill-cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.7) var(--cd,0%),transparent 0);pointer-events:none}
  .controls-mobile{position:absolute;bottom:20px;left:0;right:0;display:none;justify-content:center;gap:10px;padding:0 20px;z-index:6}
  .ctrl-btn{flex:1;max-width:65px;aspect-ratio:1;border-radius:16px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:22px;cursor:pointer}
  @media(hover:none)and(pointer:coarse){.controls-mobile{display:flex}}
  #pauseScreen,#overScreen,#passwordModal{background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:20}
  .pause-box,.over-box{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:32px 24px;width:90%;max-width:340px;text-align:center}
  .pause-box h2,.over-box h2{color:#fff;font-size:24px;margin-bottom:18px}
  .pause-stats,.over-stats{color:#aab;margin-bottom:22px;display:flex;flex-direction:column;gap:10px;font-size:15px}
  .pause-stats b,.over-stats b{color:#fff;font-size:18px}
  .pause-box .btn,.over-box .btn{width:100%;margin-bottom:8px}
  #newRecord{color:#ffd700;font-size:18px;font-weight:900;margin-top:10px}
  #shopScreen{background:linear-gradient(180deg,#0a0a15,#1a1a2e);padding:20px;overflow-y:auto;justify-content:flex-start;padding-top:20px}
  .shop-header{width:100%;max-width:600px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .shop-header h2{color:#fff;font-size:22px}
  .char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;width:100%;max-width:600px;margin-bottom:20px}
  .char-card{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.1);border-radius:16px;padding:10px 6px;text-align:center;cursor:pointer;transition:.15s}
  .char-card:hover{background:rgba(255,255,255,.15)}
  .char-card.selected{border-color:#ff8800;box-shadow:0 0 20px rgba(255,136,0,.5)}
  .char-card.locked{opacity:.6}
  .char-preview{width:60px;height:60px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5)}
  .char-name{color:#fff;font-size:12px;font-weight:700}
  .char-price{color:#ffd700;font-size:11px;margin-top:2px}
  .char-price.owned{color:#2ecc71}
  .char-skill{color:#cc88ff;font-size:10px;margin-top:2px}
  #shopScreen>.btn{width:100%;max-width:600px}
  .flash{position:fixed;inset:0;pointer-events:none;z-index:15;background:radial-gradient(circle,rgba(255,255,255,.9),transparent 70%);opacity:0;transition:opacity .15s}
  .flash.on{opacity:1;transition:opacity 0s}
  .pass-input{width:100%;padding:12px;margin-bottom:10px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:14px;outline:none}
  .pass-input:focus{border-color:#ff8800;box-shadow:0 0 0 2px rgba(255,136,0,.15)}
  .danger-flash{position:fixed;inset:0;pointer-events:none;z-index:14;background:radial-gradient(circle, transparent 40%, rgba(255,0,0,.6));opacity:0;transition:opacity .3s}
  .danger-flash.on{opacity:1;transition:opacity 0s}
</style>
</head>
<body>
<div id="authScreen" class="screen active">
  <div class="auth-box">
    <h1>SUBWAY RUNNER ANIME</h1>
    <p class="subtitle">Login online — data aman di server</p>
    <input id="authEmail" type="email" placeholder="Email" autocomplete="email">
    <input id="authUser" placeholder="Username (nama tampilan)" autocomplete="off" autocapitalize="none">
    <input id="authPass" type="password" placeholder="Password (min 6 karakter)" autocomplete="off">

<div id="menuScreen" class="screen">

  </div>
</div>
<div id="gameScreen">
  <div class="hud">
    <div class="hud-left">
      <div class="hud-score">📏 <span id="hudDistance">0</span>m</div>
      <div class="hud-coins">🪙 <span id="hudCoins">0</span></div>
    </div>
    <button class="pause-btn" onclick="pauseGame()">⏸</button>
  </div>
  <div class="status-bar" id="statusBar"></div>
  <button class="skill-btn" id="skillBtn" onclick="activateSkill()">
    <div class="skill-icon" id="skillIcon">⚡</div>
    <div id="skillName">SKILL</div>
    <div class="skill-cd" id="skillCd"></div>
  </button>
  <div class="controls-mobile">
    <button class="ctrl-btn" onclick="playerAction('left')">◀</button>
    <button class="ctrl-btn" onclick="playerAction('jump')">▲</button>
    <button class="ctrl-btn" onclick="playerAction('slide')">▼</button>
    <button class="ctrl-btn" onclick="playerAction('right')">▶</button>
  </div>
</div>
<div class="flash" id="flash"></div>
<div class="danger-flash" id="dangerFlash"></div>
<div id="pauseScreen" class="screen">
  <div class="pause-box">
    <h2>⏸ PAUSED</h2>
    <div class="pause-stats"><div>Jarak: <b><span id="pauseDistance">0</span>m</b></div><div>Koin: <b><span id="pauseCoins">0</span></b></div></div>
    <button class="btn primary" onclick="resumeGame()">▶ RESUME</button>
    <button class="btn" onclick="quitToMenu()">🏠 Menu</button>
  </div>
</div>
<div id="overScreen" class="screen">
  <div class="over-box">
    <h2>💀 GAME OVER</h2>
    <div class="over-stats">
      <div>Jarak: <b><span id="overDistance">0</span>m</b></div>
      <div>Koin: <b><span id="overCoins">0</span></b></div>
      <div id="newRecord" class="hidden">🎉 REKOR BARU! 🎉</div>
    </div>
    <button class="btn primary" onclick="startGame(false)">🔄 MAIN LAGI</button>
    <button class="btn" onclick="quitToMenu()">🏠 Menu</button>
  </div>
</div>
<div id="passwordModal" class="screen">
  <div class="pause-box">
    <h2>🔒 GANTI PASSWORD</h2>
    <input id="oldPass" class="pass-input" type="password" placeholder="Password Lama">
    <input id="newPass" class="pass-input" type="password" placeholder="Password Baru (min 6)">
    <input id="confirmPass" class="pass-input" type="password" placeholder="Konfirmasi Password Baru">
    <button class="btn primary" onclick="changePassword()">✓ Simpan</button>
    <button class="btn" onclick="closePasswordModal()">✕ Batal</button>
  </div>
</div>
<div id="shopScreen" class="screen">
  <div class="shop-header"><h2>👕 PILIH KARAKTER</h2><div class="coins-display">🪙 <span id="shopCoins">0</span></div></div>
  <div id="charGrid" class="char-grid"></div>
  <button class="btn" onclick="closeShop()">◀ Kembali</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-app.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-firestore.min.js"></script>

<script>
/* ================================================================
   FIREBASE CONFIG
   ================================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyAMm0-BEsoy-EhqCj_FBgTHhN14y_chTjk",
  authDomain: "subwaysurf-f098f.firebaseapp.com",
  projectId: "subwaysurf-f098f",
  storageBucket: "subwaysurf-f098f.firebasestorage.app",
  messagingSenderId: "481164714472",
  appId: "1:481164714472:web:965fd667742eb17a7b845d",
  measurementId: "G-RX9F00KGR0"
};

let auth, db;
try {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
  auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
} catch(e) {
  document.body.innerHTML = '<div style="padding:40px;color:#fff;font-family:sans-serif;background:#0a0a15;min-height:100vh"><h1 style="color:#ff8800">⚠️ Firebase Error</h1><p>' + e.message + '</p></div>';
  throw e;
}

/* ================================================================
   CONFIG GAME
   ================================================================ */
const USE_CUSTOM_SONG=false,CUSTOM_SONG_FILE='lagu.mp3';
const LANES=[-2.2,0,2.2],PLAYER_Z=0;
const BASE_SPEED=32,MAX_SPEED=82,SPEED_PER_M=0.018;
const JUMP_V=13,GRAVITY=42,TRAIN_TOP=2.9;

/* ================================================================
   CHARACTERS
   ================================================================ */
const CHARACTERS=[
  {id:'naruto',name:'Naruto',outfit:0xff6600,hair:0xf7d641,skin:0xffd8b0,hairType:'spiky',acc:'headband',eyeColor:0x4499ff,skillName:'Rasengan',skillIcon:'🌀',skillColor:0x00ccff,effect:'destroy',duration:2.5,cooldown:14,price:0},
  {id:'sasuke',name:'Sasuke',outfit:0x1a1a3e,hair:0x1a1a2a,skin:0xffd8b0,hairType:'spiky',acc:'sharingan',eyeColor:0xcc0000,skillName:'Chidori',skillIcon:'⚡',skillColor:0x8866ff,effect:'speed_boost',duration:4,cooldown:16,price:0},
  {id:'kakashi',name:'Kakashi',outfit:0x4a5a3a,hair:0xc0c0c0,skin:0xffd8b0,hairType:'spiky',acc:'mask',eyeColor:0x333333,skillName:'Kamui',skillIcon:'🌀',skillColor:0x6666ff,effect:'phase',duration:3,cooldown:15,price:0},
  {id:'jiraya',name:'Jiraya',outfit:0xcc0000,hair:0xf0f0f0,skin:0xffd8b0,hairType:'long',acc:'headband',eyeColor:0x333333,skillName:'Sage Mode',skillIcon:'🐸',skillColor:0xff8800,effect:'coins_x3',duration:6,cooldown:18,price:300},
  {id:'sakura',name:'Sakura',outfit:0xff69b4,hair:0xffb6c1,skin:0xffd8b0,hairType:'long',acc:'headband',eyeColor:0x66cc99,skillName:'Cherry Blossom',skillIcon:'🌸',skillColor:0xff69b4,effect:'destroy',duration:3,cooldown:15,price:400},
  {id:'hinata',name:'Hinata',outfit:0xeeddaa,hair:0x2a2a4a,skin:0xffd8b0,hairType:'long',acc:'byakugan',eyeColor:0xeeeeff,skillName:'Byakugan',skillIcon:'👁️',skillColor:0xddddff,effect:'magnet',duration:5,cooldown:14,price:500},
  {id:'minato',name:'Minato',outfit:0xffffff,hair:0xf7d641,skin:0xffd8b0,hairType:'spiky',acc:'headband',eyeColor:0x4499ff,skillName:'Flying Raijin',skillIcon:'⚡',skillColor:0xffff00,effect:'teleport',duration:0.5,cooldown:20,price:800},
  {id:'madara',name:'Madara',outfit:0x4a1a1a,hair:0x1a1a1a,skin:0xffd8b0,hairType:'long',acc:'sharingan',eyeColor:0xcc0000,skillName:'Susanoo',skillIcon:'🔮',skillColor:0x9900ff,effect:'invincible',duration:4,cooldown:18,price:1000},
  {id:'itachi',name:'Itachi',outfit:0x2a1a3a,hair:0x1a1a1a,skin:0xffd8b0,hairType:'long',acc:'sharingan',eyeColor:0xcc0000,skillName:'Tsukuyomi',skillIcon:'🌙',skillColor:0xff0000,effect:'slow',duration:4,cooldown:17,price:1200},
  {id:'gaara',name:'Gaara',outfit:0x8b0000,hair:0xcc3333,skin:0xffd8b0,hairType:'spiky',acc:'none',eyeColor:0x88ccff,skillName:'Sand Shield',skillIcon:'🏜️',skillColor:0xddaa44,effect:'invincible',duration:5,cooldown:16,price:700},
  {id:'rocklee',name:'Rock Lee',outfit:0x00aa00,hair:0x111111,skin:0xffd8b0,hairType:'bowl',acc:'headband',eyeColor:0x333333,skillName:'Eight Gates',skillIcon:'🔥',skillColor:0xff0000,effect:'speed_boost',duration:5,cooldown:18,price:900},
  {id:'pain',name:'Pain',outfit:0x333333,hair:0xff8800,skin:0xdddddd,hairType:'spiky',acc:'rinnegan',eyeColor:0x9900cc,skillName:'Shinra Tensei',skillIcon:'💥',skillColor:0x88aaff,effect:'destroy_all',duration:3,cooldown:22,price:1500},
];
const CHAR_MAP={};CHARACTERS.forEach(c=>CHAR_MAP[c.id]=c);

/* ================================================================
   AUTH STATE
   ================================================================ */
let currentUser = null;
let userData = null;
let dataUnsubscribe = null;
let pendingSignupUsername = null;

function getFirebaseErrorMessage(code) {
  const msgs = {
    'auth/email-already-in-use': 'Email sudah terdaftar. Silakan login.',
    'auth/invalid-email': 'Format email tidak valid.',
    'auth/weak-password': 'Password terlalu lemah (min 6 karakter).',
    'auth/user-not-found': 'Email tidak terdaftar.',
    'auth/wrong-password': 'Password salah.',
    'auth/too-many-requests': 'Terlalu banyak percobaan. Tunggu beberapa menit.',
    'auth/network-request-failed': 'Tidak ada koneksi internet.',
    'auth/requires-recent-login': 'Login ulang dulu untuk aksi ini.',
    'auth/invalid-login-credentials': 'Email atau password salah.',
  };
  return msgs[code] || 'Error: ' + (code || 'unknown');
}

function showAuthMsg(msg, type) {
  const el = document.getElementById('authMsg');
  el.textContent = msg;
  el.className = 'msg ' + type;
}

async function doSignup() {
  const email = document.getElementById('authEmail').value.trim();
  const username = document.getElementById('authUser').value.trim();
  const pass = document.getElementById('authPass').value;

  if (!email.includes('@')) return showAuthMsg('Email tidak valid', 'err');
  if (username.length < 3) return showAuthMsg('Username minimal 3 karakter', 'err');
  if (pass.length < 6) return showAuthMsg('Password minimal 6 karakter', 'err');

  showAuthMsg('Mendaftar...', 'ok');
  try {
    pendingSignupUsername = username;
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    await cred.user.updateProfile({ displayName: username });
    showAuthMsg('✓ Akun dibuat! Memuat data...', 'ok');
  } catch(e) {
    pendingSignupUsername = null;
    showAuthMsg(getFirebaseErrorMessage(e.code), 'err');
  }
}

async function doLogin() {
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;

  if (!email.includes('@')) return showAuthMsg('Email tidak valid', 'err');
  if (pass.length < 6) return showAuthMsg('Password minimal 6 karakter', 'err');

  showAuthMsg('Login...', 'ok');
  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch(e) {
    showAuthMsg(getFirebaseErrorMessage(e.code), 'err');
  }
}

async function forgotPassword() {
  const email = document.getElementById('authEmail').value.trim();
  if (!email.includes('@')) return showAuthMsg('Isi email dulu, lalu klik Lupa Password', 'err');
  try {
    await auth.sendPasswordResetEmail(email);
    showAuthMsg('✓ Email reset dikirim ke ' + email + ' (cek inbox/spam)', 'ok');
  } catch(e) {
    showAuthMsg(getFirebaseErrorMessage(e.code), 'err');
  }
}

async function logout() {
  if (gameRunning) pauseGame();
  await saveUserData();
  await auth.signOut();
}

async function saveUserData() {
  if (!currentUser || !userData) return;
  try {
    await db.collection('users').doc(currentUser).update({
      coins: userData.coins,
      highScore: userData.highScore,
      currentChar: userData.currentChar,
      unlockedChars: userData.unlockedChars,
      totalGames: userData.totalGames || 0
    });
  } catch(e) {
    console.error('Save error:', e);
  }
}

function refreshMenu() {
  if (!userData) return;
  document.getElementById('menuUser').textContent = userData.username || 'Player';
  document.getElementById('menuCoins').textContent = userData.coins || 0;
  document.getElementById('menuHighScore').textContent = userData.highScore || 0;
  const ch = CHAR_MAP[userData.currentChar] || CHARACTERS[0];
  const av = document.getElementById('menuAvatar');
  av.textContent = ch.name[0];
  av.style.background = `linear-gradient(135deg,#${ch.outfit.toString(16).padStart(6,'0')},#${ch.hair.toString(16).padStart(6,'0')})`;
  document.getElementById('resumeBtn').classList.toggle('hidden', !loadResumeState());
}

auth.onAuthStateChanged(async (user) => {
  if (dataUnsubscribe) { dataUnsubscribe(); dataUnsubscribe = null; }

  if (user) {
    currentUser = user.uid;
    try {
      let snap = await db.collection('users').doc(user.uid).get();

      if (!snap.exists) {
        const uname = pendingSignupUsername || user.displayName || 'Player';
        await db.collection('users').doc(user.uid).set({
          username: uname,
          email: user.email,
          coins: 0,
          highScore: 0,
          currentChar: 'naruto',
          unlockedChars: ['naruto','sasuke','kakashi'],
          totalGames: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        pendingSignupUsername = null;
        snap = await db.collection('users').doc(user.uid).get();
      }

      userData = snap.data();
      userData.username = userData.username || user.displayName || 'Player';

      document.getElementById('authScreen').classList.remove('active');
      document.getElementById('menuScreen').classList.add('active');
      refreshMenu();
      initAudio();

      dataUnsubscribe = db.collection('users').doc(user.uid).onSnapshot(s => {
        if (!s.exists) return;
        const newData = s.data();
        const oldUsername = userData ? userData.username : '';
        userData = newData;
        userData.username = newData.username || oldUsername || 'Player';
        if (document.getElementById('menuScreen').classList.contains('active')) {
          refreshMenu();
        }
      });

    } catch(e) {
      console.error('Load error:', e);
      showAuthMsg('Gagal load: ' + e.message, 'err');
    }
  } else {
    currentUser = null;
    userData = null;
    ['menuScreen','gameScreen','overScreen','pauseScreen','passwordModal','shopScreen'].forEach(id => {
      document.getElementById(id).classList.remove('active');
    });
    document.getElementById('authScreen').classList.add('active');
    document.getElementById('authPass').value = '';
    showAuthMsg('', '');
  }
});

function openPasswordModal() {
  document.getElementById('passwordModal').classList.add('active');
  document.getElementById('oldPass').value = '';
  document.getElementById('newPass').value = '';
  document.getElementById('confirmPass').value = '';
}
function closePasswordModal() {
  document.getElementById('passwordModal').classList.remove('active');
}
async function changePassword() {
  const oldPass = document.getElementById('oldPass').value;
  const newPass = document.getElementById('newPass').value;
  const confirm = document.getElementById('confirmPass').value;
  if (!oldPass) return alert('Isi password lama');
  if (newPass.length < 6) return alert('Password baru minimal 6 karakter');
  if (newPass !== confirm) return alert('Konfirmasi tidak cocok');
  const user = auth.currentUser;
  if (!user) return alert('Tidak ada user login');
  try {
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, oldPass);
    await user.reauthenticateWithCredential(cred);
    await user.updatePassword(newPass);
    alert('✓ Password berhasil diubah!');
    closePasswordModal();
  } catch(e) {
    alert('Gagal: ' + getFirebaseErrorMessage(e.code));
  }
}

let audioCtx=null,musicPlaying=false,musicTimer=null,musicMuted=false,customAudio=null;
function initAudio(){if(audioCtx)return;try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function playTone(freq,time,dur,vol,type='sine'){
  if(!audioCtx)return;
  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
  osc.frequency.value=freq;osc.type=type;
  gain.gain.setValueAtTime(0,time);gain.gain.linearRampToValueAtTime(vol,time+0.01);gain.gain.exponentialRampToValueAtTime(0.001,time+dur);
  osc.connect(gain);gain.connect(audioCtx.destination);osc.start(time);osc.stop(time+dur+0.05);
}
function makeNoiseBuffer(duration){
  const len=Math.floor(audioCtx.sampleRate*duration);
  const buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  return buf;
}
const NOTE={C3:130.81,A2:110,F3:174.61,G3:196,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880,B5:987.77};
function scheduleLoop(){
  if(!musicPlaying||musicMuted)return;
  const now=audioCtx.currentTime,beat=60/128;
  const mel=[['C5',0,.5],['E5',.5,.5],['G5',1,.5],['E5',1.5,.5],['A5',2,.5],['G5',2.5,.5],['E5',3,1],['D5',4,.5],['F5',4.5,.5],['A5',5,.5],['F5',5.5,.5],['G5',6,1],['E5',7,.5],['D5',7.5,.5]];
  const bass=[['C3',0,1],['C3',1,1],['F3',2,1],['G3',3,1],['C3',4,1],['A2',5,1],['F3',6,1],['G3',7,1]];
  mel.forEach(([n,b,d])=>playTone(NOTE[n],now+b*beat,d*beat*.85,.06,'square'));
  bass.forEach(([n,b,d])=>playTone(NOTE[n],now+b*beat,d*beat*.85,.09,'triangle'));
  musicTimer=setTimeout(scheduleLoop,8*beat*1000);
}
function startMusic(){if(!audioCtx)initAudio();if(musicPlaying)return;musicPlaying=true;if(USE_CUSTOM_SONG){customAudio=new Audio(CUSTOM_SONG_FILE);customAudio.loop=true;customAudio.volume=.35;customAudio.play().catch(()=>{})}else if(!musicMuted)scheduleLoop()}
function stopMusic(){musicPlaying=false;if(musicTimer)clearTimeout(musicTimer);if(customAudio){customAudio.pause();customAudio=null}}
function toggleMusic(){musicMuted=!musicMuted;document.getElementById('musicLabel').textContent=musicMuted?'OFF':'ON';if(musicMuted)stopMusic();else startMusic()}
function sfx(type){
  if(!audioCtx||musicMuted)return;
  const n=audioCtx.currentTime;
  if(type==='coin'){playTone(1046,n,.06,.13,'sine');playTone(1568,n+.04,.1,.11,'sine');playTone(2093,n+.07,.08,.08,'sine')}
  else if(type==='jump'){playTone(400,n,.12,.1,'square');playTone(800,n+.05,.1,.08,'square')}
  else if(type==='slide'){playTone(200,n,.2,.1,'sawtooth')}
  else if(type==='hit'){
    const noise=audioCtx.createBufferSource();noise.buffer=makeNoiseBuffer(.3);
    const nf=audioCtx.createBiquadFilter();nf.type='lowpass';nf.frequency.value=800;
    const ng=audioCtx.createGain();ng.gain.setValueAtTime(.4,n);ng.gain.exponentialRampToValueAtTime(.001,n+.3);
    noise.connect(nf);nf.connect(ng);ng.connect(audioCtx.destination);noise.start(n);noise.stop(n+.3);
    playTone(100,n,.3,.3,'sawtooth');playTone(60,n+.05,.4,.25,'sawtooth');
  }
  else if(type==='bite'){
    playTone(150,n,.1,.4,'sawtooth');playTone(80,n+.05,.2,.4,'square');
    const noise=audioCtx.createBufferSource();noise.buffer=makeNoiseBuffer(.15);
    const ng=audioCtx.createGain();ng.gain.setValueAtTime(.4,n);ng.gain.exponentialRampToValueAtTime(.001,n+.15);
    noise.connect(ng);ng.connect(audioCtx.destination);noise.start(n);noise.stop(n+.15);
  }
  else if(type==='boots'){playTone(523,n,.08,.13,'sine');playTone(659,n+.06,.08,.13,'sine');playTone(784,n+.12,.15,.13,'sine')}
  else if(type==='wings'){playTone(392,n,.15,.15,'sine');playTone(523,n+.1,.15,.15,'sine');playTone(784,n+.2,.2,.15,'sine');playTone(1046,n+.35,.3,.13,'sine')}
  else if(type==='board'){playTone(300,n,.1,.12,'square');playTone(600,n+.08,.15,.12,'square')}
}

function playConsonant(type,t,dur){
  const noise=audioCtx.createBufferSource();
  noise.buffer=makeNoiseBuffer(dur+0.02);
  const nf=audioCtx.createBiquadFilter();
  const cfg={ch:['highpass',2200,0.16],d:['lowpass',900,0.18],r:['bandpass',1600,0.14],k:['lowpass',1200,0.20],g:['lowpass',800,0.16],s:['highpass',4000,0.10],sh:['highpass',2500,0.15],t:['lowpass',2500,0.18],b:['lowpass',500,0.22],m:['lowpass',400,0.08],n:['lowpass',500,0.08],h:['highpass',1500,0.08],p:['lowpass',800,0.18],y:['bandpass',2000,0.05],ts:['highpass',3500,0.16]};
  const c=cfg[type]||['bandpass',1500,0.14];
  nf.type=c[0];nf.frequency.value=c[1];if(c[0]==='bandpass')nf.Q.value=3;
  const ng=audioCtx.createGain();ng.gain.setValueAtTime(0,t);ng.gain.linearRampToValueAtTime(c[2],t+0.005);ng.gain.exponentialRampToValueAtTime(0.001,t+dur);
  noise.connect(nf);nf.connect(ng);ng.connect(audioCtx.destination);noise.start(t);noise.stop(t+dur+0.02);
}
function speakJutsu(charId){
  if(!audioCtx||musicMuted)return;
  const p=VOICE_PROFILES[charId],sy=JUTSU_SYLLABLES[charId];
  if(!p||!sy)return;
  const n=audioCtx.currentTime + 0.1;
  let echoInput=null;
  if(p.echo>0){
    echoInput=audioCtx.createGain();echoInput.gain.value=p.echo;
    const dl=audioCtx.createDelay();dl.delayTime.value=0.15;
    const fb=audioCtx.createGain();fb.gain.value=0.35;
    const out=audioCtx.createGain();out.gain.value=0.5;
    echoInput.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(out);out.connect(audioCtx.destination);
  }
  let t=0;
  sy.forEach(s=>{
    const st=n+t,dur=s.d,bp=p.pitch*s.pm,ep=s.em?bp*0.75:bp*0.92;
    const gl=audioCtx.createOscillator();gl.type='sawtooth';
    gl.frequency.setValueAtTime(bp*1.05,st);gl.frequency.linearRampToValueAtTime(ep,st+dur);
    const vib=audioCtx.createOscillator();const vg=audioCtx.createGain();
    vib.frequency.value=p.vibrato;vg.gain.value=4;
    vib.connect(vg);vg.connect(gl.frequency);vib.start(st);vib.stop(st+dur+0.05);
    const fm=VOWEL_FORMANTS[s.v]||VOWEL_FORMANTS.a;
    fm.forEach((fr,i)=>{
      const f=audioCtx.createBiquadFilter();
      f.type='bandpass';f.frequency.value=fr*p.formantScale;f.Q.value=[14,18,20][i];
      const g=audioCtx.createGain();const vol=[0.40,0.25,0.15][i]*(s.em?1.5:1);
      g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(vol,st+0.04);g.gain.setValueAtTime(vol,st+dur-0.10);g.gain.exponentialRampToValueAtTime(0.001,st+dur);
      gl.connect(f);f.connect(g);g.connect(audioCtx.destination);
      if(echoInput)g.connect(echoInput);
    });
    gl.start(st);gl.stop(st+dur+0.05);
    if(s.nas){
      const na=audioCtx.createOscillator(),ng=audioCtx.createGain();
      na.type='sine';na.frequency.value=240;
      ng.gain.setValueAtTime(0,st+dur*0.5);ng.gain.linearRampToValueAtTime(0.08,st+dur*0.65);ng.gain.exponentialRampToValueAtTime(0.001,st+dur);
      na.connect(ng);ng.connect(audioCtx.destination);na.start(st+dur*0.5);na.stop(st+dur+0.05);
    }
    if(s.c)playConsonant(s.c,st,0.06);
    t+=dur;
  });
}

  if(hasRamp){const rm=new THREE.MeshStandardMaterial({color:0x777777,metalness:.6,roughness:.4});const steps=10,w=1.85;for(let i=0;i<steps;i++){const sh=TRAIN_TOP/steps,sy=sh*(i+.5),sz=6+rampLength*(1-(i+.5)/steps);const step=new THREE.Mesh(new THREE.BoxGeometry(w,sh,rampLength/steps),rm);step.position.set(0,sy,sz);step.castShadow=true;step.receiveShadow=true;g.add(step)}}

function randomLane(){return Math.floor(Math.random()*3)}
function addTrain(lane,withRamp){const hasRamp=withRamp!==undefined?withRamp:(Math.random()<.45);const rampLength=hasRamp?(3+Math.random()):0;const m=createTrain(Math.random()<.5?0xe74c3c:0x2980b9,hasRamp,rampLength);m.position.set(LANES[lane],0,-110);scene.add(m);obstacles.push({mesh:m,type:'train',length:12,yBottom:0,yTop:TRAIN_TOP,lane,hasRamp,rampLength})}
function addBarrier(lane){const m=createBarrier();m.position.set(LANES[lane],0,-110);scene.add(m);obstacles.push({mesh:m,type:'barrier',length:1,yBottom:0,yTop:1.2,lane})}
function addHighBar(lane){const m=createHighBar();m.position.set(LANES[lane],0,-110);scene.add(m);obstacles.push({mesh:m,type:'highbar',length:1,yBottom:1.7,yTop:2.6,lane})}
function spawnCoinArc(lane,air){if(lane===undefined)lane=randomLane();const count=6+Math.floor(Math.random()*3);for(let i=0;i<count;i++){const m=createCoinMesh();const y=air?(6+Math.sin(i*.5)*1):(1.1+Math.sin(i*.5)*.4);m.position.set(LANES[lane],y,-110-i*2);scene.add(m);coins.push({mesh:m})}}
function addBoots(lane){const m=createBootsMesh();m.position.set(LANES[lane],1.0,-110);scene.add(m);powerups.push({mesh:m,type:'boots'})}
function addWings(lane){const m=createWingsMesh();m.position.set(LANES[lane],1.2,-110);scene.add(m);powerups.push({mesh:m,type:'wings'})}
function addHoverboard(lane){const m=createHoverboardMesh();m.position.set(LANES[lane],0.5,-110);scene.add(m);powerups.push({mesh:m,type:'hoverboard'})}
function spawnPattern(){
  const r=Math.random();
  if(!wingsActive&&!hoverboardActive){if(r<0.02){addWings(randomLane());return}if(r<0.05){addHoverboard(randomLane());return}if(r<0.10&&!bootsActive){addBoots(randomLane());return}}
  if(r<0.20){spawnCoinArc();return}
  const patterns=[()=>addTrain(randomLane()),()=>{const free=randomLane();for(let i=0;i<3;i++)if(i!==free)addTrain(i)},()=>{for(let i=0;i<3;i++)addBarrier(i)},()=>{for(let i=0;i<3;i++)addHighBar(i)},()=>{const l=randomLane();addTrain(l);addBarrier((l+1)%3)},()=>{const l=randomLane();addTrain(l);addHighBar((l+1)%3)},()=>{addTrain(randomLane());addTrain(randomLane());spawnCoinArc()},()=>{addBarrier(0);addHighBar(1);addBarrier(2)},()=>{addBarrier(randomLane());addTrain((randomLane()+1)%3)}];
  patterns[Math.floor(Math.random()*patterns.length)]();
}

function startGame(isResume){
  if(!userData)return;initAudio();
  document.getElementById('menuScreen').classList.remove('active');document.getElementById('overScreen').classList.remove('active');document.getElementById('pauseScreen').classList.remove('active');document.getElementById('gameScreen').classList.add('active');
  initThree();resetGameState();
  if(isResume){const s=loadResumeState();if(s){distance=s.distance;gameSpeed=s.gameSpeed;gameCoins=s.gameCoins}}
  setCharacter(userData.currentChar);player.position.set(0,0,PLAYER_Z);targetX=0;currentLane=1;playerY=0;playerVY=0;
  gameRunning=true;gamePaused=false;susanooNextAttack=4;startMusic();clock.getDelta();updateSkillButton();requestAnimationFrame(gameLoop);
}
function resetGameState(){
  if(obstacles)obstacles.forEach(o=>scene.remove(o.mesh));if(coins)coins.forEach(c=>scene.remove(c.mesh));if(powerups)powerups.forEach(p=>scene.remove(p.mesh));if(particles)particles.forEach(p=>scene.remove(p));if(rings)rings.forEach(r=>scene.remove(r.mesh));if(arrowWarnings)arrowWarnings.forEach(w=>{scene.remove(w.marker);scene.remove(w.markerAura)});if(arrows)arrows.forEach(a=>scene.remove(a.mesh));
  obstacles=[];coins=[];powerups=[];particles=[];rings=[];arrowWarnings=[];arrows=[];
  distance=0;gameSpeed=BASE_SPEED;gameCoins=0;playerY=0;playerVY=0;isJumping=false;isSliding=false;slideTimer=0;
  bootsActive=false;bootsTimer=0;wingsActive=false;wingsTimer=0;hoverboardActive=false;hoverboardTimer=0;invincibleTimer=0;skillActiveTimer=0;skillCooldownTimer=0;activeSkillEffect=null;
  coinMultiplier=1;timeSlowFactor=1;nextSpawnDistance=30;shakeTime=0;barkTimer=0;susanooNextAttack=4;
  dogChaseDistance=5;
  if(player)player.scale.y=1;updateHUD();updateStatusBar();
}
function gameLoop(){if(!gameRunning||gamePaused)return;gameLoopId=requestAnimationFrame(gameLoop);const dt=Math.min(clock.getDelta(),0.05);updateGame(dt);renderer.render(scene,camera)}
function getGroundY(){let gy=0;for(const o of obstacles){if(o.type==='train'){if(Math.abs(o.mesh.position.x-player.position.x)<1.0&&Math.abs(o.mesh.position.z-PLAYER_Z)<o.length/2){if(playerY>=TRAIN_TOP-1.0)gy=Math.max(gy,TRAIN_TOP)}}}return gy}
function updateGame(dt){
  const scaledDt=dt*timeSlowFactor;

  // Pemulihan kecepatan perlahan setelah tabrakan
  const targetSpeed=Math.min(BASE_SPEED+distance*SPEED_PER_M,MAX_SPEED);
  if(gameSpeed<targetSpeed){gameSpeed+=15*dt;if(gameSpeed>targetSpeed)gameSpeed=targetSpeed}
  else{gameSpeed=targetSpeed}

  distance+=gameSpeed*scaledDt;

  // Anjing mengejar jika pemain lambat
  dogChaseDistance-=(gameSpeed<15?2.0:0.5)*dt;
  if(dogChaseDistance<5&&gameSpeed>=15)dogChaseDistance+=0.8*dt;
  if(dogChaseDistance>6)dogChaseDistance=6;
  dog.position.z=dogChaseDistance;
  dog.position.x+=(player.position.x-dog.position.x)*Math.min(dt*5,1);

  // Gonggong jika anjing dekat
  if(dogChaseDistance<3.5&&Math.random()<0.05)sfxBark();

  // Anjing menggigit
  if(dogChaseDistance<=1.2&&!wingsActive&&!hoverboardActive){dogBite();return}

  player.position.x+=(targetX-player.position.x)*Math.min(dt*20,1);
  if(bootsActive){bootsTimer-=dt;if(bootsTimer<=0)bootsActive=false}
  if(wingsActive){wingsTimer-=dt;if(wingsTimer<=0)wingsActive=false}
  if(hoverboardActive){hoverboardTimer-=dt;if(hoverboardTimer<=0)hoverboardActive=false}
  if(invincibleTimer>0)invincibleTimer-=dt;if(skillActiveTimer>0){skillActiveTimer-=dt;if(skillActiveTimer<=0)endSkill()}
  if(skillCooldownTimer>0){skillCooldownTimer-=dt;if(skillCooldownTimer<0)skillCooldownTimer=0}
  if(isSliding){slideTimer-=dt;if(slideTimer<=0){isSliding=false;player.scale.y=1}}
  let onRamp=false;for(const o of obstacles){if(o.type==='train'&&o.hasRamp&&Math.abs(o.mesh.position.x-player.position.x)<1.0){const fz=o.mesh.position.z+6+o.rampLength,bz=o.mesh.position.z+6;if(PLAYER_Z>=bz&&PLAYER_Z<=fz){const t=(fz-PLAYER_Z)/o.rampLength,rampY=t*TRAIN_TOP;if(rampY>playerY){playerY=rampY;playerVY=0;isJumping=false}onRamp=true}}}
  if(wingsActive){playerY+=(8-playerY)*Math.min(dt*4,1);playerVY=0;isJumping=false;if(Math.random()<0.4){const lane=randomLane(),c=createCoinMesh();c.position.set(LANES[lane],6+Math.random()*3,-100);scene.add(c);coins.push({mesh:c})}}
  else if(!onRamp){if(isJumping){playerVY-=GRAVITY*dt;playerY+=playerVY*dt;if(playerVY<0){const gy=getGroundY();if(playerY<=gy+0.3){playerY=gy;playerVY=0;isJumping=false}}}else if(playerY>0.05){const gy=getGroundY();if(playerY>gy+0.05){playerVY-=GRAVITY*dt;playerY+=playerVY*dt;if(playerY<=gy){playerY=gy;playerVY=0}}else if(playerY<gy)playerY=gy}else playerY=getGroundY()}
  if(hoverboardActive&&!wingsActive&&!onRamp)playerY=Math.max(playerY,0.2)+Math.sin(performance.now()*0.005)*0.05;
  player.position.y=playerY;player.userData.board.visible=hoverboardActive;player.userData.board.position.set(0,-0.15,0.1);player.userData.wings.visible=wingsActive;
  if(skillActiveTimer>0)player.userData.aura.material.opacity=0.6+Math.sin(performance.now()*0.01)*0.3;else player.userData.aura.material.opacity=0;
  animateCharacter(dt);animateDog(dt);animateSusanoo(dt);

  const move=gameSpeed*scaledDt;roadTexture.offset.y=(roadTexture.offset.y-move*0.04)%1;
  for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.mesh.position.z+=move;if(o.mesh.position.z>20){scene.remove(o.mesh);obstacles.splice(i,1)}}
  for(let i=coins.length-1;i>=0;i--){const c=coins[i];c.mesh.position.z+=move;c.mesh.rotation.y+=dt*5;if(c.mesh.position.z>20){scene.remove(c.mesh);coins.splice(i,1)}}
  for(let i=powerups.length-1;i>=0;i--){const p=powerups[i];p.mesh.position.z+=move;p.mesh.rotation.y+=dt*3;p.mesh.position.y=(p.type==='hoverboard'?0.5:1.0)+Math.sin(performance.now()*0.003)*0.2;if(p.mesh.position.z>20){scene.remove(p.mesh);powerups.splice(i,1)}}
  if(distance>nextSpawnDistance){spawnPattern();const gap=26+Math.random()*14;nextSpawnDistance=distance+Math.max(24,gap-distance*0.015)}
  if(gameRunning&&!gamePaused){susanooNextAttack-=dt;if(susanooNextAttack<=0){spawnSusanooAttack();susanooNextAttack=Math.max(2.5,4.5-distance/800)+Math.random()*1.5}}

  for(let i=coins.length-1;i>=0;i--){const c=coins[i];const px=player.position.x,py=playerY+1;if(activeSkillEffect==='magnet'){const dx=px-c.mesh.position.x,dy=py-c.mesh.position.y,dz=-c.mesh.position.z;const d=Math.sqrt(dx*dx+dy*dy+dz*dz);if(d<8){c.mesh.position.x+=dx*dt*8;c.mesh.position.y+=dy*dt*8;c.mesh.position.z+=dz*dt*8}}if(Math.abs(c.mesh.position.z-PLAYER_Z)<1.3&&Math.abs(c.mesh.position.x-px)<1.0&&Math.abs(c.mesh.position.y-py)<1.5){gameCoins+=coinMultiplier;sfx('coin');spawnCoinBurst(c.mesh.position.x,c.mesh.position.y,c.mesh.position.z);scene.remove(c.mesh);coins.splice(i,1)}}
  for(let i=powerups.length-1;i>=0;i--){const p=powerups[i];if(Math.abs(p.mesh.position.z-PLAYER_Z)<1.4&&Math.abs(p.mesh.position.x-player.position.x)<1.2&&Math.abs(p.mesh.position.y-(playerY+1))<2){if(p.type==='boots'){bootsActive=true;bootsTimer=8;sfx('boots')}else if(p.type==='wings'){wingsActive=true;wingsTimer=7;sfx('wings');hoverboardActive=false}else if(p.type==='hoverboard'){hoverboardActive=true;hoverboardTimer=20;sfx('board')}updateStatusBar();scene.remove(p.mesh);powerups.splice(i,1)}}

  // Tabrakan: memperlambat, bukan langsung mati
  if(!wingsActive&&invincibleTimer<=0&&!onRamp){
    for(const o of obstacles){
      if(Math.abs(o.mesh.position.x-player.position.x)>1.1)continue;
      if(Math.abs(o.mesh.position.z-PLAYER_Z)>o.length/2+0.4)continue;
      let collided=false;
      if(o.type==='train'){
        if(playerY>=TRAIN_TOP-0.7)continue;
        const pTop=playerY+(isSliding?0.9:1.8);
        if(pTop>o.yBottom&&playerY<o.yTop)collided=true;
      }else if(o.type==='barrier'){
        const pTop=playerY+(isSliding?0.9:1.8);
        if(playerY<o.yTop&&pTop>o.yBottom)collided=true;
      }else if(o.type==='highbar'){
        const pTop=playerY+(isSliding?0.9:1.8);
        if(pTop>o.yBottom&&playerY<o.yTop)collided=true;
      }
      if(collided){
        if(hoverboardActive){hoverboardActive=false;invincibleTimer=1.0}
        else{handleCollision()}
        break;
      }
    }
  }

  if(shakeTime>0){shakeTime-=dt;camera.position.x=(Math.random()-.5)*0.6;camera.position.y=5.5+(Math.random()-.5)*0.5}else{camera.position.x+=(0-camera.position.x)*Math.min(dt*8,1);camera.position.y+=(5.5-camera.position.y)*Math.min(dt*8,1)}
  camera.lookAt(player.position.x*0.3,1.8+playerY*0.3,-12);
  updateParticles(dt);updateRings(dt);updateArrowWarnings(dt);updateArrows(dt);updateHUD();updateStatusBar();updateSkillUI();
}

function handleCollision(){
  gameSpeed=5;
  dogChaseDistance-=2.5;
  if(dogChaseDistance<1.2)dogChaseDistance=1.2;
  shakeTime=0.5;
  sfx('hit');
  const df=document.getElementById('dangerFlash');
  df.classList.add('on');
  setTimeout(()=>df.classList.remove('on'),300);
  invincibleTimer=1.0;
}

function dogBite(){
  gameRunning=false;
  if(gameLoopId)cancelAnimationFrame(gameLoopId);
  sfx('bite');
  const finalScore=Math.floor(distance);
  userData.coins=(userData.coins||0)+gameCoins;
  const isNew=finalScore>(userData.highScore||0);
  if(isNew)userData.highScore=finalScore;
  userData.totalGames=(userData.totalGames||0)+1;
  saveUserData();clearResumeState();stopMusic();
  document.getElementById('overDistance').textContent=finalScore;
  document.getElementById('overCoins').textContent=gameCoins;
  document.getElementById('newRecord').classList.toggle('hidden',!isNew);
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('overScreen').classList.add('active');
}

function animateCharacter(dt){
  const a=player.userData.anim;if(!a)return;const ss=8+gameSpeed*0.25;animTime+=dt*ss;
  if(wingsActive){a.armL.rotation.x=-0.6;a.armR.rotation.x=-0.6;a.armL.rotation.z=-0.7+Math.sin(animTime*.6)*0.2;a.armR.rotation.z=0.7-Math.sin(animTime*.6)*0.2;a.legL.rotation.x=0.4+Math.sin(animTime*.5)*0.1;a.legR.rotation.x=0.4-Math.sin(animTime*.5)*0.1;a.bodyGroup.position.y=0}

function activateSkill(){
  if(!gameRunning||gamePaused)return;if(skillCooldownTimer>0||skillActiveTimer>0)return;
  const char=CHAR_MAP[userData.currentChar]||CHARACTERS[0];
  sfxSkill(char);triggerFlash(char.skillColor);spawnSkillVFX(char);shakeTime=0.4;
  skillActiveTimer=char.duration;skillCooldownTimer=char.cooldown;activeSkillEffect=char.effect;invincibleTimer=Math.max(invincibleTimer,char.duration);
  if(char.effect==='destroy'||char.effect==='destroy_all'){for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];if(o.mesh.position.z<PLAYER_Z+5&&o.mesh.position.z>PLAYER_Z-45){spawnExplosion(o.mesh.position.x,1.5,o.mesh.position.z,char.skillColor);scene.remove(o.mesh);obstacles.splice(i,1);if(char.effect==='destroy')break}}}

}

function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.userData.life-=dt;if(p.userData.life<=0){scene.remove(p);particles.splice(i,1);continue}p.userData.vy-=15*dt;p.position.x+=p.userData.vx*dt;p.position.y+=p.userData.vy*dt;p.position.z+=p.userData.vz*dt;const s=Math.max(.1,p.userData.life);p.scale.set(s,s,s)}}
function updateRings(dt){for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.life-=dt;if(r.life<=0){scene.remove(r.mesh);rings.splice(i,1);continue}if(r.delay>0){r.delay-=dt;continue}const t=1-r.life;if(r.maxScale!==undefined){const sc=1+t*(r.maxScale-1);r.mesh.scale.set(sc,sc,sc)}if(r.mesh.material.transparent)r.mesh.material.opacity=Math.max(0,r.life);if(r.drift){r.mesh.position.y+=dt*1.5;r.mesh.rotation.x+=dt*3;r.mesh.rotation.y+=dt*2}if(r.spin)r.mesh.rotation.z+=dt*5}}

function addSusanooBow(){
  if(!susanoo||susanoo.userData.bow)return;
  const bowMat=new THREE.MeshStandardMaterial({color:0xb36bff,emissive:0x7a2cff,emissiveIntensity:2.2,transparent:true,opacity:.92});
  const bow=new THREE.Group();
  const arc=new THREE.Mesh(new THREE.TorusGeometry(10,.5,8,40,Math.PI),bowMat);
  arc.rotation.z=Math.PI/2;bow.add(arc);
  const str=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,20,6),new THREE.MeshBasicMaterial({color:0xffccff}));
  bow.add(str);
  bow.position.set(-9,6,6);bow.rotation.y=.4;
  susanoo.add(bow);susanoo.userData.bow=bow;
  for(let i=0;i<24;i++){
    const f=new THREE.Mesh(new THREE.ConeGeometry(.5+Math.random()*.6,2.5+Math.random()*3,6),new THREE.MeshBasicMaterial({color:i%2?0xcc88ff:0x7a2cff,transparent:true,opacity:.55}));
    const a=Math.random()*Math.PI*2,r=3+Math.random()*5;
    f.position.set(Math.cos(a)*r,10+Math.random()*14,Math.sin(a)*r*.6);
    f.userData.baseY=f.position.y;f.userData.ph=Math.random()*6;
    susanoo.add(f);(susanoo.userData.flames=susanoo.userData.flames||[]).push(f);
  }
}
function animateSusanoo(dt){
  if(!susanoo)return;addSusanooBow();
  const t=performance.now()*0.001;
  susanoo.position.y=susanooBaseY+Math.sin(t*0.8)*0.6;
  susanoo.rotation.y=Math.sin(t*0.3)*0.05;
  if(susanoo.userData.arms){susanoo.userData.arms[0].rotation.z=Math.sin(t*0.5)*0.08;susanoo.userData.arms[1].rotation.z=-Math.sin(t*0.5)*0.08}
  if(susanoo.userData.flames)susanoo.userData.flames.forEach(f=>{f.position.y=f.userData.baseY+Math.sin(t*4+f.userData.ph)*1.2;const s=1+Math.sin(t*6+f.userData.ph)*.25;f.scale.set(s,1.3*s,s)});
  const aura=susanoo.children.find(c=>c.geometry&&c.geometry.type==='SphereGeometry'&&c.geometry.parameters.radius===24);
  if(aura){aura.rotation.y+=dt*.3;aura.material.opacity=.1+Math.sin(t*3)*.05}
}

function updateHUD(){document.getElementById('hudDistance').textContent=Math.floor(distance);document.getElementById('hudCoins').textContent=gameCoins}
function updateStatusBar(){const bar=document.getElementById('statusBar');const items=[];if(bootsActive)items.push({cls:'pill-boots',txt:'👢 BOOTS '+Math.ceil(bootsTimer)+'s'});if(wingsActive)items.push({cls:'pill-wings',txt:'🪽 FLY '+Math.ceil(wingsTimer)+'s'});if(hoverboardActive)items.push({cls:'pill-board',txt:'🛹 BOARD '+Math.ceil(hoverboardTimer)+'s'});if(skillActiveTimer>0){const c=CHAR_MAP[userData.currentChar];items.push({cls:'pill-skill',txt:c.skillIcon+' '+c.skillName.split(' ')[0]})}bar.innerHTML=items.map(i=>`<div class="status-pill ${i.cls}">${i.txt}</div>`).join('')}

function playerAction(a){
  if(!gameRunning||gamePaused)return;
  if(a==='left'&&currentLane>0){currentLane--;targetX=LANES[currentLane]}
  else if(a==='right'&&currentLane<2){currentLane++;targetX=LANES[currentLane]}
  else if(a==='jump'){if(wingsActive)return;if(!isJumping){isJumping=true;playerVY=bootsActive?18:JUMP_V;isSliding=false;player.scale.y=1;sfx('jump')}}
  else if(a==='slide'){if(wingsActive)return;isJumping=false;playerVY=0;playerY=getGroundY();if(!isSliding){isSliding=true;slideTimer=.8;sfx('slide')}}
}
document.addEventListener('keydown',e=>{if(!gameRunning||gamePaused)return;const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a'){playerAction('left');e.preventDefault()}else if(k==='arrowright'||k==='d'){playerAction('right');e.preventDefault()}else if(k==='arrowup'||k==='w'||k===' '){playerAction('jump');e.preventDefault()}else if(k==='arrowdown'||k==='s'){playerAction('slide');e.preventDefault()}else if(k==='q'||k==='shift'){activateSkill();e.preventDefault()}else if(k==='escape'||k==='p'){pauseGame()}});
let tX=0,tY=0;
document.addEventListener('touchstart',e=>{if(e.target.closest('button'))return;tX=e.touches[0].clientX;tY=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(e.target.closest('button'))return;const dx=e.changedTouches[0].clientX-tX,dy=e.changedTouches[0].clientY-tY;if(Math.abs(dx)<30&&Math.abs(dy)<30)return;if(Math.abs(dx)>Math.abs(dy))playerAction(dx>0?'right':'left');else playerAction(dy>0?'slide':'jump')},{passive:true});

function pauseGame(){if(!gameRunning||gamePaused)return;gamePaused=true;if(gameLoopId)cancelAnimationFrame(gameLoopId);saveResumeState();document.getElementById('pauseDistance').textContent=Math.floor(distance);document.getElementById('pauseCoins').textContent=gameCoins;document.getElementById('pauseScreen').classList.add('active');if(customAudio)customAudio.pause();else stopMusic()}
function resumeGame(){if(!gamePaused)return;gamePaused=false;gameRunning=true;document.getElementById('pauseScreen').classList.remove('active');clock.getDelta();startMusic();requestAnimationFrame(gameLoop)}
function quitToMenu(){saveUserData();gameRunning=false;gamePaused=false;if(gameLoopId)cancelAnimationFrame(gameLoopId);document.getElementById('pauseScreen').classList.remove('active');document.getElementById('overScreen').classList.remove('active');document.getElementById('gameScreen').classList.remove('active');document.getElementById('menuScreen').classList.add('active');stopMusic();refreshMenu()}
function saveResumeState(){if(!currentUser)return;localStorage.setItem('sr3d_resume_'+currentUser,JSON.stringify({distance,gameSpeed,gameCoins}))}
function loadResumeState(){if(!currentUser)return null;const s=localStorage.getItem('sr3d_resume_'+currentUser);return s?JSON.parse(s):null}
function clearResumeState(){if(!currentUser)return;localStorage.removeItem('sr3d_resume_'+currentUser)}
function onResize(){if(!renderer)return;camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)}

function openShop(){document.getElementById('menuScreen').classList.remove('active');document.getElementById('shopScreen').classList.add('active');renderCharGrid()}
function closeShop(){document.getElementById('shopScreen').classList.remove('active');document.getElementById('menuScreen').classList.add('active');refreshMenu()}
function renderCharGrid(){
  document.getElementById('shopCoins').textContent=userData.coins||0;const grid=document.getElementById('charGrid');grid.innerHTML='';
  CHARACTERS.forEach(char=>{const owned=(userData.unlockedChars||[]).includes(char.id);const selected=userData.currentChar===char.id;const card=document.createElement('div');card.className='char-card'+(selected?' selected':'')+(!owned?' locked':'');const oH='#'+char.outfit.toString(16).padStart(6,'0');const hH='#'+char.hair.toString(16).padStart(6,'0');card.innerHTML=`<div class="char-preview" style="background:linear-gradient(135deg,${oH},${hH})">${char.name[0]}</div><div class="char-name">${char.name}</div><div class="char-skill">${char.skillIcon} ${char.skillName}</div><div class="char-price ${owned?'owned':''}">${owned?(selected?'✓ DIPAKAI':'DIMILIKI'):'🪙 '+char.price}</div>`;card.onclick=()=>selectChar(char);grid.appendChild(card)});
}
function selectChar(char){
  const owned=(userData.unlockedChars||[]).includes(char.id);
  if(!owned){if((userData.coins||0)<char.price){alert('Koin tidak cukup! Butuh 🪙 '+char.price);return}if(!confirm(`Beli ${char.name} seharga 🪙 ${char.price}?`))return;userData.coins-=char.price;if(!userData.unlockedChars)userData.unlockedChars=[];userData.unlockedChars.push(char.id)}
  userData.currentChar=char.id;saveUserData();renderCharGrid();
}

document.addEventListener('visibilitychange',()=>{if(document.hidden&&gameRunning&&!gamePaused)pauseGame();if(document.hidden)saveUserData()});
document.getElementById('authPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
document.getElementById('authUser').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('authPass').focus()});
document.getElementById('authEmail').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('authUser').focus()});
</script>
