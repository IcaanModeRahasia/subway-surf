<style>

  .ach-card.locked{opacity:.5}
  .ach-card.unlocked{border-color:#ffd700;background:rgba(255,215,0,.08)}
  .lb-row{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,.06);border-radius:10px;margin-bottom:6px;color:#fff}

  .char-grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr))!important}

async function doSignup(){const e=document.getElementById('authEmail').value.trim(),u=document.getElementById('authUser').value.trim(),p=document.getElementById('authPass').value;if(!e.includes('@'))return showAuthMsg('Email tidak valid','err');if(u.length<3)return showAuthMsg('Username minimal 3','err');if(p.length<6)return showAuthMsg('Password minimal 6','err');showAuthMsg('Mendaftar...','ok');try{pendingSignupUsername=u;const c=await auth.createUserWithEmailAndPassword(e,p);await c.user.updateProfile({displayName:u});showAuthMsg('✓ Akun dibuat!','ok');}catch(err){pendingSignupUsername=null;showAuthMsg(getFirebaseErrorMessage(err.code),'err');}}
async function doLogin(){const e=document.getElementById('authEmail').value.trim(),p=document.getElementById('authPass').value;if(!e.includes('@'))return showAuthMsg('Email tidak valid','err');if(p.length<6)return showAuthMsg('Password minimal 6','err');showAuthMsg('Login...','ok');try{await auth.signInWithEmailAndPassword(e,p);}catch(err){showAuthMsg(getFirebaseErrorMessage(err.code),'err');}}

let audioCtx=null,musicPlaying=false,musicTimer=null,musicMuted=false,customAudio=null;
function initAudio(){if(audioCtx)return;try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function playTone(freq,time,dur,vol,type='sine'){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type=type;g.gain.setValueAtTime(0,time);g.gain.linearRampToValueAtTime(vol,time+0.01);g.gain.exponentialRampToValueAtTime(0.001,time+dur);o.connect(g);g.connect(audioCtx.destination);o.start(time);o.stop(time+dur+0.05);}
function makeNoiseBuffer(d){const l=Math.floor(audioCtx.sampleRate*d);const b=audioCtx.createBuffer(1,l,audioCtx.sampleRate);const dd=b.getChannelData(0);for(let i=0;i<l;i++)dd[i]=Math.random()*2-1;return b;}

function scheduleLoop(){if(!musicPlaying||musicMuted)return;const now=audioCtx.currentTime,beat=60/128;const mel=[['C5',0,.5],['E5',.5,.5],['G5',1,.5],['E5',1.5,.5],['A5',2,.5],['G5',2.5,.5],['E5',3,1],['D5',4,.5],['F5',4.5,.5],['A5',5,.5],['F5',5.5,.5],['G5',6,1],['E5',7,.5],['D5',7.5,.5]];const bass=[['C3',0,1],['C3',1,1],['F3',2,1],['G3',3,1],['C3',4,1],['A2',5,1],['F3',6,1],['G3',7,1]];mel.forEach(([n,b,d])=>playTone(NOTE[n],now+b*beat,d*beat*.85,.06,'square'));bass.forEach(([n,b,d])=>playTone(NOTE[n],now+b*beat,d*beat*.85,.09,'triangle'));musicTimer=setTimeout(scheduleLoop,8*beat*1000);}
function startMusic(){if(!audioCtx)initAudio();if(musicPlaying)return;musicPlaying=true;if(USE_CUSTOM_SONG){customAudio=new Audio(CUSTOM_SONG_FILE);customAudio.loop=true;customAudio.volume=.35;customAudio.play().catch(()=>{})}else if(!musicMuted)scheduleLoop();}

function randomLane(){return Math.floor(Math.random()*3);}

function spawnPattern(){const r=Math.random();if(!wingsActive&&!hoverboardActive){if(r<0.02){addWings(randomLane());return;}if(r<0.05){addHoverboard(randomLane());return;}if(r<0.10&&!bootsActive){addBoots(randomLane());return;}}if(r<0.20){spawnCoinArc();return;}const patterns=[()=>addTrain(randomLane()),()=>{const free=randomLane();for(let i=0;i<3;i++)if(i!==free)addTrain(i);},()=>{for(let i=0;i<3;i++)addBarrier(i);},()=>{for(let i=0;i<3;i++)addHighBar(i);},()=>{const l=randomLane();addTrain(l);addBarrier((l+1)%3);},()=>{const l=randomLane();addTrain(l);addHighBar((l+1)%3);},()=>{addTrain(randomLane());addTrain(randomLane());spawnCoinArc();},()=>{addBarrier(0);addHighBar(1);addBarrier(2);},()=>{addBarrier(randomLane());addTrain((randomLane()+1)%3);}];patterns[Math.floor(Math.random()*patterns.length)]();}

function playerAction(a){
  if(!gameRunning||gamePaused)return;
  if(a==='left'&&currentLane>0){currentLane--;targetX=LANES[currentLane]}
  else if(a==='right'&&currentLane<2){currentLane++;targetX=LANES[currentLane]}
  else if(a==='jump'){if(wingsActive)return;if(!isJumping){isJumping=true;playerVY=bootsActive?18:JUMP_V;isSliding=false;sfx('jump')}}
  else if(a==='slide'){if(wingsActive)return;isJumping=false;playerVY=0;playerY=getGroundY();if(!isSliding){isSliding=true;slideTimer=SLIDE_T;sfx('slide')}}
}

  const irisC=char.eyeColor;

    add(new THREE.Mesh(new THREE.SphereGeometry(.05,14,14),new THREE.MeshStandardMaterial({color:irisC,emissive:irisC,emissiveIntensity:.5})),s*.1,1.705,.245).scale.set(1,1.25,.5);

  });
  add(new THREE.Mesh(new THREE.BoxGeometry(.07,.012,.01),M(0x884433)),0,1.6,.255);
  add(new THREE.Mesh(new THREE.SphereGeometry(.29,22,22,0,Math.PI*2,0,Math.PI*.42),hairM),0,1.745,0);
  add(new THREE.Mesh(new THREE.BoxGeometry(.5,.42,.26),hairM),0,1.64,-.17);

    for(let i=-2;i<=2;i++){const cn=add(new THREE.Mesh(new THREE.ConeGeometry(.07,.3,6),hairM),i*.09,1.86,.22);cn.rotation.x=2.4;cn.rotation.z=-i*.15}
  }else if(char.hairType==='long'){
    add(new THREE.Mesh(new THREE.BoxGeometry(.5,.95,.16),hairM),0,1.3,-.22);
    [-1,1].forEach(s=>{add(new THREE.Mesh(new THREE.BoxGeometry(.1,.55,.14),hairM),s*.25,1.5,.08);add(new THREE.Mesh(new THREE.BoxGeometry(.08,.34,.08),hairM),s*.09,1.82,.25)});
    add(new THREE.Mesh(new THREE.BoxGeometry(.44,.1,.1),hairM),0,1.9,.2);

  return g;
}

  if(isSliding&&!wingsActive){

  for(let i=powerups.length-1;i>=0;i--){const p=powerups[i];if(Math.abs(p.mesh.position.z-PLAYER_Z)<1.4&&Math.abs(p.mesh.position.x-player.position.x)<1.2&&Math.abs(p.mesh.position.y-(playerY+1))<2){
    if(p.type==='boots'){bootsActive=true;bootsTimer=8;sfx('boots')}
    else if(p.type==='wings'){wingsActive=true;wingsTimer=7;sfx('wings');hoverboardActive=false;flyLane=currentLane;flyX=LANES[currentLane];flyAcc=0;flyCount=0}
    else if(p.type==='hoverboard'){hoverboardActive=true;hoverboardTimer=20;sfx('board')}
    updateStatusBar();scene.remove(p.mesh);powerups.splice(i,1)}}
  if(!wingsActive&&invincibleTimer<=0&&!onRamp&&rampGrace<=0){
    for(let i=0;i<obstacles.length;i++){
      const o=obstacles[i];
      if(Math.abs(o.mesh.position.x-player.position.x)>.95)continue;
      if(Math.abs(o.mesh.position.z-PLAYER_Z)>o.length/2+.3)continue;
      const pTop=playerY+(isSliding?.9:1.8);let hit=false;
      if(o.type==='train'){if(!o.moving&&playerY>=TRAIN_TOP-.7)continue;hit=pTop>o.yBottom&&playerY<o.yTop}
      else if(o.type==='barrier')hit=playerY<o.yTop&&pTop>o.yBottom;
      else hit=pTop>o.yBottom&&playerY<o.yTop;
      if(!hit)continue;
      const wasIn=o.prevZ!==undefined&&Math.abs(o.prevZ-PLAYER_Z)<=o.length/2+.3;
      if(o.sweep||wasIn){doBump(o)}
      else if(hoverboardActive){hoverboardActive=false;invincibleTimer=1;spawnExplosion(o.mesh.position.x,1.5,o.mesh.position.z,0x00ffaa);scene.remove(o.mesh);obstacles.splice(i,1);shakeTime=.3;sfx('hit')}
      else startCrash();
      break;
    }
  }
  if(dying)return;
  cameraStep(dt,true);
  updateParticles(dt);updateRings(dt);updateArrowWarnings(dt);updateArrows(dt);updateHUD();updateStatusBar();updateSkillUI();
}
updateGame=function(dt){
  if(dying){updateDying(dt);return}
  updateGameV9(dt);
}

function getMonthlyKey() { const d = new Date(); return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`; }

  if (!userData) return;

  if (!userData.quests.monthly || userData.quests.monthly.key !== mk) userData.quests.monthly = {key:mk, items:{}, claimed:{}};
}

function trackQuest(type, amount) {
  if (!userData) return;
  ensureQuests();
  ['daily','weekly','monthly'].forEach(period => {
    const pool = QUEST_DEFS[period];
    const state = userData.quests[period];
    pool.forEach(q => {
      if (q.track !== type) return;
      if (state.claimed[q.id]) return;
      const cur = state.items[q.id] || 0;
      state.items[q.id] = Math.min(q.goal, cur + amount);
    });
  });

function claimQuest(period, questId) {
  const q = QUEST_DEFS[period].find(x => x.id === questId);

  if (!q || !state) return;
  const prog = state.items[questId] || 0;
  if (prog < q.goal || state.claimed[questId]) return;
  state.claimed[questId] = true;
  if (q.reward.diamond) userData.diamonds = (userData.diamonds||0) + q.reward.diamond;
  if (q.reward.coins) userData.coins = (userData.coins||0) + q.reward.coins;

  if (q.reward.diamond) rw.push('+'+q.reward.diamond+'💎');
  if (q.reward.coins) rw.push('+'+q.reward.coins+'🪙');

  const list = document.getElementById('lbList');

  if (lbUnsub) lbUnsub();
  try {
    lbUnsub = db.collection('users').orderBy('highScore', 'desc').limit(50).onSnapshot(snap => {
      const data = [];
      snap.forEach(doc => data.push({uid: doc.id, ...doc.data()}));
      renderLeaderboard(data);
    }, err => {
      list.innerHTML = `<div style="color:#ff6b6b;text-align:center;padding:20px;font-size:12px">Gagal load leaderboard: ${err.message}<br><br>Pastikan Firestore rules mengizinkan read untuk authenticated users.</div>`;

    list.innerHTML = `<div style="color:#ff6b6b;text-align:center;padding:20px">Error: ${e.message}</div>`;

      <div class="lb-score">${u.highScore || 0}m</div>
    `;
    list.appendChild(row);
  });
}

function exchangeCoins() {
  const rate = COIN_TO_DIAMOND_RATE;
  const current = userData.coins || 0;
  if (current < rate) { showToast('🪙 Koin tidak cukup! Butuh ' + rate + ' koin = 1 💎'); return; }
  const amount = prompt(`Tukar berapa diamond?\n1 💎 = ${rate} 🪙\nKoin kamu: ${current}\nMax: ${Math.floor(current/rate)} 💎`);
  if (!amount) return;
  const n = parseInt(amount);
  if (isNaN(n) || n <= 0) { showToast('Jumlah tidak valid'); return; }
  const cost = n * rate;
  if (cost > current) { showToast('Koin tidak cukup!'); return; }
  userData.coins -= cost;
  userData.diamonds = (userData.diamonds||0) + n;
  showToast(`✓ Ditukar ${cost} 🪙 → ${n} 💎`);
  saveUserData();
  renderCharGrid();
  refreshMenu();
}
</script>
