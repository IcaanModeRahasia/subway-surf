<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Subway Runner 3D - Anime Edition</title>
<style>

  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Roboto, sans-serif; user-select: none; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
  .screen.active { display: flex; }
  #gameScreen { display: none; }
  #gameScreen.active { display: block; }

  /* AUTH */
  #authScreen { background: linear-gradient(160deg, #0f0f23, #16213e, #0f3460); }
  .auth-box { background: rgba(255,255,255,.07); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.15); border-radius: 24px; padding: 40px 32px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .auth-box h1 { font-size: 24px; margin-bottom: 6px; background: linear-gradient(90deg,#ff6b00,#ffcc00,#ff6b00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-size: 200%; animation: shine 3s infinite; }
  @keyframes shine { 0%,100%{background-position:0%} 50%{background-position:100%} }
  .subtitle { color: #8899aa; font-size: 13px; margin-bottom: 24px; }
  .auth-box input { width: 100%; padding: 14px 18px; margin-bottom: 12px; background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.15); border-radius: 12px; color: #fff; font-size: 15px; outline: none; transition: .2s; }
  .auth-box input:focus { border-color: #ff8800; box-shadow: 0 0 0 3px rgba(255,136,0,.15); }
  .auth-btns { display: flex; gap: 10px; margin-top: 8px; }
  .btn { flex: 1; padding: 14px 20px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: .15s; background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.15); }
  .btn:hover { background: rgba(255,255,255,.18); transform: translateY(-2px); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: linear-gradient(135deg,#ff6b00,#ffaa00); border: none; box-shadow: 0 8px 20px rgba(255,120,0,.35); }
  .btn.primary:hover { box-shadow: 0 12px 28px rgba(255,120,0,.5); }
  .msg { margin-top: 16px; font-size: 13px; min-height: 18px; }
  .msg.err { color: #ff6b6b; } .msg.ok { color: #2ecc71; }

  /* MENU */
  #menuScreen { background: linear-gradient(180deg, #0a0a15, #1a1a2e, #2c1e4e); }
  .menu-top { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; }
  .user-info { display: flex; align-items: center; gap: 10px; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg,#ff6b00,#ffaa00); display: flex; align-items: center; justify-content: center; font-size: 22px; border: 2px solid rgba(255,255,255,.3); }
  .username { color: #fff; font-weight: 600; font-size: 14px; }
  .coins-display { color: #ffd700; font-size: 13px; font-weight: 600; }
  .hs-display { color: #8899aa; font-size: 13px; background: rgba(0,0,0,.3); padding: 8px 14px; border-radius: 20px; }
  .menu-center { text-align: center; display: flex; flex-direction: column; gap: 12px; width: 90%; max-width: 340px; }
  .title3d { font-size: 26px; font-weight: 900; margin-bottom: 16px; letter-spacing: 2px; background: linear-gradient(180deg,#ffcc00,#ff6b00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 12px rgba(255,120,0,.5)); }
  .play-btn { font-size: 22px; padding: 20px; }
  .resume-btn { background: linear-gradient(135deg,#f39c12,#e67e22); border: none; box-shadow: 0 8px 20px rgba(243,156,18,.4); }
  .hidden { display: none !important; }

  /* GAME */
  #gameScreen { position: fixed; inset: 0; z-index: 5; }
  #gameScreen canvas { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 6; }
  .hud-left { display: flex; flex-direction: column; gap: 6px; }
  .hud-score, .hud-coins { color: #fff; font-size: 18px; font-weight: 700; background: rgba(0,0,0,.5); padding: 8px 14px; border-radius: 12px; backdrop-filter: blur(6px); }
  .pause-btn { pointer-events: auto; width: 48px; height: 48px; border-radius: 12px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.2); color: #fff; font-size: 22px; cursor: pointer; backdrop-filter: blur(6px); }
  .pause-btn:active { transform: scale(.95); }
  .status-bar { position: absolute; top: 130px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; z-index: 6; pointer-events: none; }
  .status-pill { padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 13px; color: #fff; animation: pulse 1s infinite; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  .pill-boots { background: linear-gradient(135deg,#ff9500,#ff6b00); }
  .pill-wings { background: linear-gradient(135deg,#00d2ff,#0066ff); }
  .pill-board { background: linear-gradient(135deg,#00ff88,#00aa55); }
  .pill-skill { background: linear-gradient(135deg,#cc00ff,#6600cc); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.7} }

  .skill-btn { position: absolute; bottom: 100px; right: 20px; width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle,#cc00ff,#6600cc); border: 3px solid rgba(255,255,255,.4); color: #fff; font-size: 12px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 20px rgba(204,0,255,.5); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 7; transition: .1s; }
  .skill-btn:active { transform: scale(.9); }
  .skill-btn:disabled { background: radial-gradient(circle,#444,#222); box-shadow: none; opacity: .5; }
  .skill-btn .skill-icon { font-size: 24px; margin-bottom: 2px; }
  .skill-btn .skill-cd { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(0,0,0,.7) var(--cd, 0%), transparent 0); pointer-events: none; }

  .controls-mobile { position: absolute; bottom: 20px; left: 0; right: 0; display: none; justify-content: center; gap: 10px; padding: 0 20px; z-index: 6; }
  .ctrl-btn { flex: 1; max-width: 65px; aspect-ratio: 1; border-radius: 16px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.2); color: #fff; font-size: 22px; backdrop-filter: blur(6px); cursor: pointer; }
  .ctrl-btn:active { background: rgba(255,136,0,.4); transform: scale(.95); }
  @media (hover: none) and (pointer: coarse) { .controls-mobile { display: flex; } .skill-btn { bottom: 100px; right: 20px; } }

  #pauseScreen, #overScreen { background: rgba(0,0,0,.8); backdrop-filter: blur(8px); z-index: 20; }
  .pause-box, .over-box { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); border-radius: 24px; padding: 36px 28px; width: 90%; max-width: 340px; text-align: center; }
  .pause-box h2, .over-box h2 { color: #fff; font-size: 26px; margin-bottom: 20px; }
  .pause-stats, .over-stats { color: #aab; margin-bottom: 24px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
  .pause-stats b, .over-stats b { color: #fff; font-size: 18px; }
  .pause-box .btn, .over-box .btn { width: 100%; margin-bottom: 10px; }
  #newRecord { color: #ffd700; font-size: 18px; font-weight: 900; margin-top: 10px; animation: pulse 1s infinite; }

  /* SHOP */
  #shopScreen { background: linear-gradient(180deg,#0a0a15,#1a1a2e); padding: 20px; overflow-y: auto; justify-content: flex-start; padding-top: 20px; }
  .shop-header { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .shop-header h2 { color: #fff; font-size: 22px; }
  .char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px,1fr)); gap: 10px; width: 100%; max-width: 600px; margin-bottom: 20px; }
  .char-card { background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.1); border-radius: 16px; padding: 10px 6px; text-align: center; cursor: pointer; transition: .15s; position: relative; }
  .char-card:hover { background: rgba(255,255,255,.15); transform: translateY(-2px); }
  .char-card.selected { border-color: #ff8800; box-shadow: 0 0 20px rgba(255,136,0,.5); }
  .char-card.locked { opacity: .6; }
  .char-preview { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: inset -4px -4px 12px rgba(0,0,0,.4); }
  .char-name { color: #fff; font-size: 12px; font-weight: 700; }
  .char-price { color: #ffd700; font-size: 11px; margin-top: 2px; }
  .char-price.owned { color: #2ecc71; }
  .char-skill { color: #cc88ff; font-size: 10px; margin-top: 2px; }
  #shopScreen > .btn { width: 100%; max-width: 600px; }

  .flash { position: fixed; inset: 0; pointer-events: none; z-index: 15; background: radial-gradient(circle, rgba(255,255,255,.9), transparent 70%); opacity: 0; transition: opacity .15s; }
  .flash.on { opacity: 1; transition: opacity 0s; }
</style>
</head>
<body>

<!-- AUTH -->
<div id="authScreen" class="screen active">
  <div class="auth-box">
    <h1>SUBWAY RUNNER ANIME</h1>
    <p class="subtitle">Masuk atau daftar untuk mulai</p>
    <input id="authUser" placeholder="Username" autocomplete="off" autocapitalize="none">
    <input id="authPass" type="password" placeholder="Password" autocomplete="off">
    <div class="auth-btns">
      <button class="btn primary" onclick="doLogin()">Login</button>
      <button class="btn" onclick="doSignup()">Daftar</button>
    </div>
    <div id="authMsg" class="msg"></div>
  </div>
</div>

<!-- MENU -->
<div id="menuScreen" class="screen">
  <div class="menu-top">
    <div class="user-info">
      <div class="avatar" id="menuAvatar">👤</div>
      <div>
        <div id="menuUser" class="username">Player</div>
        <div class="coins-display">🪙 <span id="menuCoins">0</span></div>
      </div>
    </div>
    <div class="hs-display">🏆 <span id="menuHighScore">0</span>m</div>
  </div>
  <div class="menu-center">
    <h2 class="title3d">SUBWAY RUNNER<br>ANIME EDITION</h2>
    <button id="resumeBtn" class="btn resume-btn hidden" onclick="startGame(true)">⏵ LANJUTKAN</button>
    <button class="btn primary play-btn" onclick="startGame(false)">▶ MULAI</button>
    <button class="btn" onclick="openShop()">👕 KARAKTER & SKIN</button>
    <button class="btn" onclick="toggleMusic()">🎵 Musik: <span id="musicLabel">ON</span></button>
    <button class="btn" onclick="logout()">🚪 Keluar</button>
  </div>
</div>

<!-- GAME -->
<div id="gameScreen">
  <div class="hud">
    <div class="hud-left">
      <div class="hud-score">📏 <span id="hudDistance">0</span>m</div>
      <div class="hud-coins">🪙 <span id="hudCoins">0</span></div>
    </div>
    <button class="pause-btn" onclick="pauseGame()">⏸</button>
  </div>
  <div class="status-bar" id="statusBar"></div>
  <button class="skill-btn" id="skillBtn" onclick="activateSkill()">
    <div class="skill-icon" id="skillIcon">⚡</div>
    <div id="skillName">SKILL</div>
    <div class="skill-cd" id="skillCd"></div>
  </button>
  <div class="controls-mobile">
    <button class="ctrl-btn" onclick="playerAction('left')">◀</button>
    <button class="ctrl-btn" onclick="playerAction('jump')">▲</button>
    <button class="ctrl-btn" onclick="playerAction('slide')">▼</button>
    <button class="ctrl-btn" onclick="playerAction('right')">▶</button>
  </div>
</div>

<div class="flash" id="flash"></div>

<!-- PAUSE -->
<div id="pauseScreen" class="screen">
  <div class="pause-box">
    <h2>⏸ PAUSED</h2>
    <div class="pause-stats">
      <div>Jarak: <b><span id="pauseDistance">0</span>m</b></div>
      <div>Koin: <b><span id="pauseCoins">0</span></b></div>
    </div>
    <button class="btn primary" onclick="resumeGame()">▶ RESUME</button>
    <button class="btn" onclick="quitToMenu()">🏠 Menu</button>
  </div>
</div>

<!-- OVER -->
<div id="overScreen" class="screen">
  <div class="over-box">
    <h2>💀 GAME OVER</h2>
    <div class="over-stats">
      <div>Jarak: <b><span id="overDistance">0</span>m</b></div>
      <div>Koin: <b><span id="overCoins">0</span></b></div>
      <div id="newRecord" class="hidden">🎉 REKOR BARU! 🎉</div>
    </div>
    <button class="btn primary" onclick="startGame(false)">🔄 MAIN LAGI</button>
    <button class="btn" onclick="quitToMenu()">🏠 Menu</button>
  </div>
</div>

<!-- SHOP -->
<div id="shopScreen" class="screen">
  <div class="shop-header">
    <h2>👕 PILIH KARAKTER</h2>
    <div class="coins-display">🪙 <span id="shopCoins">0</span></div>
  </div>
  <div id="charGrid" class="char-grid"></div>
  <button class="btn" onclick="closeShop()">◀ Kembali</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ==========================================================
   CONFIG & CONSTANTS
   ========================================================== */
const USE_CUSTOM_SONG = false;
const CUSTOM_SONG_FILE = 'lagu.mp3';
const LANES = [-2.2, 0, 2.2];
const PLAYER_Z = 0;
const BASE_SPEED = 32;
const MAX_SPEED = 80;
const SPEED_PER_M = 0.018;
const JUMP_V = 16;
const GRAVITY = 42;
const TRAIN_TOP = 2.9;
const DOG_Z = 5;

/* ==========================================================
   ANIME CHARACTERS
   ========================================================== */
const CHARACTERS = [
  { id:'naruto', name:'Naruto', outfit:0xff6600, hair:0xf7d641, skin:0xffd8b0,
    hairType:'spiky', acc:'headband', eyeColor:0x4499ff,
    skillName:'Rasengan', skillIcon:'🌀', skillColor:0x00ccff,
    effect:'destroy', duration:2.5, cooldown:14, price:0,
    desc:'Hancurkan rintangan di depan' },
  { id:'sasuke', name:'Sasuke', outfit:0x1a1a3e, hair:0x1a1a2a, skin:0xffd8b0,
    hairType:'spiky', acc:'sharingan', eyeColor:0xcc0000,
    skillName:'Chidori', skillIcon:'⚡', skillColor:0x8866ff,
    effect:'speed_boost', duration:4, cooldown:16, price:0,
    desc:'Lari super cepat + kebal' },
  { id:'kakashi', name:'Kakashi', outfit:0x4a5a3a, hair:0xc0c0c0, skin:0xffd8b0,
    hairType:'spiky', acc:'mask', eyeColor:0x333333,
    skillName:'Kamui', skillIcon:'🌀', skillColor:0x6666ff,
    effect:'phase', duration:3, cooldown:15, price:0,
    desc:'Kebal + tembus rintangan' },
  { id:'jiraya', name:'Jiraya', outfit:0xcc0000, hair:0xf0f0f0, skin:0xffd8b0,
    hairType:'long', acc:'headband', eyeColor:0x333333,
    skillName:'Sage Mode', skillIcon:'🐸', skillColor:0xff8800,
    effect:'coins_x3', duration:6, cooldown:18, price:300,
    desc:'Koin x3 selama 6 detik' },
  { id:'sakura', name:'Sakura', outfit:0xff69b4, hair:0xffb6c1, skin:0xffd8b0,
    hairType:'long', acc:'headband', eyeColor:0x66cc99,
    skillName:'Cherry Blossom', skillIcon:'🌸', skillColor:0xff69b4,
    effect:'destroy', duration:3, cooldown:15, price:400,
    desc:'Hancurkan rintangan + kebal' },
  { id:'hinata', name:'Hinata', outfit:0xeeddaa, hair:0x2a2a4a, skin:0xffd8b0,
    hairType:'long', acc:'byakugan', eyeColor:0xeeeeff,
    skillName:'Byakugan', skillIcon:'👁️', skillColor:0xddddff,
    effect:'magnet', duration:5, cooldown:14, price:500,
    desc:'Tarik semua koin di sekitar' },
  { id:'minato', name:'Minato', outfit:0xffffff, hair:0xf7d641, skin:0xffd8b0,
    hairType:'spiky', acc:'headband', eyeColor:0x4499ff,
    skillName:'Flying Raijin', skillIcon:'⚡', skillColor:0xffff00,
    effect:'teleport', duration:0.5, cooldown:20, price:800,
    desc:'Teleport 30m ke depan' },
  { id:'madara', name:'Madara', outfit:0x4a1a1a, hair:0x1a1a1a, skin:0xffd8b0,
    hairType:'long', acc:'sharingan', eyeColor:0xcc0000,
    skillName:'Susanoo', skillIcon:'🔮', skillColor:0x9900ff,
    effect:'invincible', duration:4, cooldown:18, price:1000,
    desc:'Kebal total 4 detik' },
  { id:'itachi', name:'Itachi', outfit:0x2a1a3a, hair:0x1a1a1a, skin:0xffd8b0,
    hairType:'long', acc:'sharingan', eyeColor:0xcc0000,
    skillName:'Tsukuyomi', skillIcon:'🌙', skillColor:0xff0000,
    effect:'slow', duration:4, cooldown:17, price:1200,
    desc:'Perlambat waktu + kebal' },
  { id:'gaara', name:'Gaara', outfit:0x8b0000, hair:0xcc3333, skin:0xffd8b0,
    hairType:'spiky', acc:'none', eyeColor:0x88ccff,
    skillName:'Sand Shield', skillIcon:'🏜️', skillColor:0xddaa44,
    effect:'invincible', duration:5, cooldown:16, price:700,
    desc:'Perisai pasir kebal 5 detik' },
  { id:'rocklee', name:'Rock Lee', outfit:0x00aa00, hair:0x111111, skin:0xffd8b0,
    hairType:'bowl', acc:'headband', eyeColor:0x333333,
    skillName:'Eight Gates', skillIcon:'🔥', skillColor:0xff0000,
    effect:'speed_boost', duration:5, cooldown:18, price:900,
    desc:'Kecepatan maksimal + kebal' },
  { id:'pain', name:'Pain', outfit:0x333333, hair:0xff8800, skin:0xdddddd,
    hairType:'spiky', acc:'rinnegan', eyeColor:0x9900cc,
    skillName:'Shinra Tensei', skillIcon:'💥', skillColor:0x88aaff,
    effect:'destroy_all', duration:3, cooldown:22, price:1500,
    desc:'Hancurkan semua rintangan' },
];
const CHAR_MAP = {};
CHARACTERS.forEach(c => CHAR_MAP[c.id] = c);

/* ==========================================================
   AUTH
   ========================================================== */
let currentUser = null, userData = null;

function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = ((h << 5) - h + str.charCodeAt(i)) | 0;
  return 'h' + Math.abs(h).toString(36);
}
function getUsers() { return JSON.parse(localStorage.getItem('sr3d_users') || '{}'); }
function saveUsers(u) { localStorage.setItem('sr3d_users', JSON.stringify(u)); }
function showAuthMsg(msg, type) {
  const el = document.getElementById('authMsg');
  el.textContent = msg; el.className = 'msg ' + type;
}
function doSignup() {
  const u = document.getElementById('authUser').value.trim();
  const p = document.getElementById('authPass').value;
  if (u.length < 3) return showAuthMsg('Username minimal 3 karakter', 'err');
  if (p.length < 4) return showAuthMsg('Password minimal 4 karakter', 'err');
  const users = getUsers();
  if (users[u]) return showAuthMsg('Username sudah dipakai!', 'err');
  users[u] = {
    pass: simpleHash(p), coins: 0, highScore: 0,
    currentChar: 'naruto',
    unlockedChars: ['naruto', 'sasuke', 'kakashi'],
    totalGames: 0
  };
  saveUsers(users);
  showAuthMsg('✓ Akun dibuat! Silakan login.', 'ok');
  document.getElementById('authPass').value = '';
}
function doLogin() {
  const u = document.getElementById('authUser').value.trim();
  const p = document.getElementById('authPass').value;
  const users = getUsers();
  if (!users[u]) return showAuthMsg('Username tidak ditemukan', 'err');
  if (users[u].pass !== simpleHash(p)) return showAuthMsg('Password salah', 'err');
  currentUser = u; userData = users[u];
  if (!userData.unlockedChars) userData.unlockedChars = ['naruto', 'sasuke', 'kakashi'];
  if (!userData.currentChar) userData.currentChar = 'naruto';
  document.getElementById('authScreen').classList.remove('active');
  document.getElementById('menuScreen').classList.add('active');
  refreshMenu();
  initAudio();
}
function logout() {
  if (gameRunning) pauseGame();
  saveUserData();
  currentUser = null; userData = null;
  document.getElementById('menuScreen').classList.remove('active');
  document.getElementById('authScreen').classList.add('active');
  document.getElementById('authPass').value = '';
  showAuthMsg('', '');
}
function saveUserData() {
  if (!currentUser) return;
  const users = getUsers();
  users[currentUser] = userData;
  saveUsers(users);
}
function refreshMenu() {
  document.getElementById('menuUser').textContent = currentUser;
  document.getElementById('menuCoins').textContent = userData.coins;
  document.getElementById('menuHighScore').textContent = userData.highScore;
  const ch = CHAR_MAP[userData.currentChar] || CHARACTERS[0];
  document.getElementById('menuAvatar').textContent = ch.name[0];
  document.getElementById('menuAvatar').style.background = `linear-gradient(135deg, #${ch.outfit.toString(16).padStart(6,'0')}, #${ch.hair.toString(16).padStart(6,'0')})`;
  const resume = loadResumeState();
  document.getElementById('resumeBtn').classList.toggle('hidden', !resume);
}

/* ==========================================================
   AUDIO
   ========================================================== */
let audioCtx = null, musicPlaying = false, musicTimer = null, musicMuted = false;
let customAudio = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, time, dur, vol, type = 'sine') {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.value = freq;
  osc.type = type;
  gain.gain.setValueAtTime(0, time);
  gain.gain.linearRampToValueAtTime(vol, time + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(time); osc.stop(time + dur + 0.05);
}
const NOTE = { C3:130.81, A2:110, F3:174.61, G3:196, E3:164.81,
  C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880, B5:987.77 };
function scheduleLoop() {
  if (!musicPlaying || musicMuted) return;
  const now = audioCtx.currentTime;
  const beat = 60 / 128;
  const mel = [
    ['C5',0,.5],['E5',.5,.5],['G5',1,.5],['E5',1.5,.5],
    ['A5',2,.5],['G5',2.5,.5],['E5',3,1],
    ['D5',4,.5],['F5',4.5,.5],['A5',5,.5],['F5',5.5,.5],
    ['G5',6,1],['E5',7,.5],['D5',7.5,.5]
  ];
  const bass = [['C3',0,1],['C3',1,1],['F3',2,1],['G3',3,1],['C3',4,1],['A2',5,1],['F3',6,1],['G3',7,1]];
  mel.forEach(([n,b,d]) => playTone(NOTE[n], now+b*beat, d*beat*.85, .06, 'square'));
  bass.forEach(([n,b,d]) => playTone(NOTE[n], now+b*beat, d*beat*.85, .09, 'triangle'));
  musicTimer = setTimeout(scheduleLoop, 8 * beat * 1000);
}
function startMusic() {
  if (!audioCtx) initAudio();
  if (musicPlaying) return;
  musicPlaying = true;
  if (USE_CUSTOM_SONG) {
    customAudio = new Audio(CUSTOM_SONG_FILE);
    customAudio.loop = true; customAudio.volume = 0.35;
    customAudio.play().catch(()=>{});
  } else if (!musicMuted) scheduleLoop();
}
function stopMusic() {
  musicPlaying = false;
  if (musicTimer) clearTimeout(musicTimer);
  if (customAudio) { customAudio.pause(); customAudio = null; }
}
function toggleMusic() {
  musicMuted = !musicMuted;
  document.getElementById('musicLabel').textContent = musicMuted ? 'OFF' : 'ON';
  if (musicMuted) stopMusic(); else startMusic();
}

function sfx(type) {
  if (!audioCtx || musicMuted) return;
  const n = audioCtx.currentTime;
  if (type === 'coin') {
    playTone(1046, n, .06, .13, 'sine');
    playTone(1568, n + .04, .1, .11, 'sine');
    playTone(2093, n + .07, .08, .08, 'sine');
  } else if (type === 'jump') {
    playTone(400, n, .12, .1, 'square');
    playTone(800, n + .05, .1, .08, 'square');
  } else if (type === 'slide') {
    playTone(200, n, .2, .1, 'sawtooth');
  } else if (type === 'hit') {
    playTone(150, n, .35, .25, 'sawtooth');
    playTone(80, n + .05, .5, .2, 'sawtooth');
  } else if (type === 'boots') {
    playTone(523, n, .08, .13, 'sine');
    playTone(659, n + .06, .08, .13, 'sine');
    playTone(784, n + .12, .15, .13, 'sine');
  } else if (type === 'wings') {
    playTone(392, n, .15, .15, 'sine');
    playTone(523, n + .1, .15, .15, 'sine');
    playTone(784, n + .2, .2, .15, 'sine');
    playTone(1046, n + .35, .3, .13, 'sine');
  } else if (type === 'board') {
    playTone(300, n, .1, .12, 'square');
    playTone(600, n + .08, .15, .12, 'square');
  } else if (type === 'skill') {
    playTone(200, n, .1, .2, 'sawtooth');
    playTone(400, n + .05, .1, .2, 'sawtooth');
    playTone(800, n + .1, .1, .2, 'sawtooth');
    playTone(1600, n + .15, .3, .18, 'sine');
    playTone(2400, n + .2, .25, .15, 'sine');
  }
}
function sfxBark() {
  if (!audioCtx || musicMuted) return;
  const n = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(320, n);
  osc.frequency.exponentialRampToValueAtTime(120, n + 0.18);
  gain.gain.setValueAtTime(0, n);
  gain.gain.linearRampToValueAtTime(0.12, n + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, n + 0.22);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(n); osc.stop(n + 0.25);
}

function makeRoadTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#3a3d42'; ctx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 800; i++) {
    ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.04})`;
    ctx.fillRect(Math.random()*512, Math.random()*512, 2, 2);
  }
  ctx.strokeStyle = '#f0c040'; ctx.lineWidth = 6;
  ctx.setLineDash([40, 40]);
  [170, 342].forEach(x => {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke();
  });
  ctx.setLineDash([]);
  ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(10,512); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(502,0); ctx.lineTo(502,512); ctx.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  return tex;
}

function buildCharacter(char) {
  const g = new THREE.Group();
  bodyGroup = new THREE.Group();
  g.add(bodyGroup);

  const bodyMat = new THREE.MeshStandardMaterial({ color: char.outfit, roughness: .55, metalness: .1 });
  const skinMat = new THREE.MeshStandardMaterial({ color: char.skin, roughness: .7 });
  const pantsMat = new THREE.MeshStandardMaterial({ color: 0x222244, roughness: .7 });
  const hairMat = new THREE.MeshStandardMaterial({ color: char.hair, roughness: .9 });
  const shoeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: .5 });

  const body = new THREE.Mesh(new THREE.BoxGeometry(.55, .7, .32), bodyMat);
  body.position.y = 1.05; body.castShadow = true; bodyGroup.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(.23, 16, 16), skinMat);
  head.position.y = 1.65; head.castShadow = true; bodyGroup.add(head);

  // Hair
  if (char.hairType === 'spiky') {
    for (let i = 0; i < 10; i++) {
      const cone = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.28, 6), hairMat);
      const angle = (i / 10) * Math.PI * 2;
      cone.position.set(Math.cos(angle) * 0.15, 1.83 + Math.random() * 0.05, Math.sin(angle) * 0.15);
      cone.rotation.z = Math.cos(angle) * 0.6;
      cone.rotation.x = Math.sin(angle) * 0.6;
      bodyGroup.add(cone);
    }
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16, 0, Math.PI*2, 0, Math.PI/1.8), hairMat);
    cap.position.y = 1.7; bodyGroup.add(cap);
  } else if (char.hairType === 'long') {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.26, 16, 16, 0, Math.PI*2, 0, Math.PI/1.8), hairMat);
    cap.position.y = 1.7; bodyGroup.add(cap);
    const back = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.65, 0.14), hairMat);
    back.position.set(0, 1.4, -0.18); bodyGroup.add(back);
    // side hair
    [-1, 1].forEach(s => {
      const sideH = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.15), hairMat);
      sideH.position.set(s * 0.22, 1.5, 0.05); bodyGroup.add(sideH);
    });
  } else if (char.hairType === 'bowl') {
    const bowl = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16, 0, Math.PI*2, 0, Math.PI/1.6), hairMat);
    bowl.position.y = 1.68; bodyGroup.add(bowl);
  }

  // Eyes
  const eyeMat = new THREE.MeshStandardMaterial({ color: char.eyeColor, emissive: char.eyeColor, emissiveIntensity: 0.3 });
  [-1, 1].forEach(s => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), eyeMat);
    eye.position.set(s * 0.08, 1.66, 0.21); bodyGroup.add(eye);
  });

  // Accessories
  if (char.acc === 'headband') {
    const band = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.07, 0.06), new THREE.MeshStandardMaterial({ color: 0x2266cc }));
    band.position.set(0, 1.72, 0.2); bodyGroup.add(band);
    const plate = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.1, 0.03), new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.2 }));
    plate.position.set(0, 1.72, 0.24); bodyGroup.add(plate);
  }
  if (char.acc === 'mask') {
    const mask = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.16, 0.06), new THREE.MeshStandardMaterial({ color: 0x222222 }));
    mask.position.set(0, 1.58, 0.21); bodyGroup.add(mask);
  }

  // Arms (with pivots for animation)
  const armPivotL = new THREE.Group();
  armPivotL.position.set(-0.35, 1.3, 0);
  const armL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.55, 0.15), bodyMat);
  armL.position.y = -0.275; armL.castShadow = true;
  armPivotL.add(armL); bodyGroup.add(armPivotL);

  const armPivotR = new THREE.Group();
  armPivotR.position.set(0.35, 1.3, 0);
  const armR = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.55, 0.15), bodyMat);
  armR.position.y = -0.275; armR.castShadow = true;
  armPivotR.add(armR); bodyGroup.add(armPivotR);

  // Legs (with pivots)
  const legPivotL = new THREE.Group();
  legPivotL.position.set(-0.14, 0.65, 0);
  const legL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.2), pantsMat);
  legL.position.y = -0.3; legL.castShadow = true;
  legPivotL.add(legL); bodyGroup.add(legPivotL);
  const shoeL = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.12, 0.32), shoeMat);
  shoeL.position.set(0, -0.55, 0.05);
  legPivotL.add(shoeL);

  const legPivotR = new THREE.Group();
  legPivotR.position.set(0.14, 0.65, 0);
  const legR = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.2), pantsMat);
  legR.position.y = -0.3; legR.castShadow = true;
  legPivotR.add(legR); bodyGroup.add(legPivotR);
  const shoeR = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.12, 0.32), shoeMat);
  shoeR.position.set(0, -0.55, 0.05);
  legPivotR.add(shoeR);

  // Save animation refs
  g.userData.anim = { armL: armPivotL, armR: armPivotR, legL: legPivotL, legR: legPivotR, bodyGroup, eyeMat };

  // Aura glow (skill effect)
  const aura = new THREE.Mesh(
    new THREE.TorusGeometry(0.8, 0.08, 8, 32),
    new THREE.MeshBasicMaterial({ color: char.skillColor, transparent: true, opacity: 0 })
  );
  aura.rotation.x = Math.PI / 2;
  aura.position.y = 0.1;
  g.userData.aura = aura;
  g.add(aura);

  // Wings (hidden)
  const wings = buildWings();
  wings.visible = false;
  g.userData.wings = wings;
  g.add(wings);

  // Hoverboard (hidden)
  const board = buildHoverboard();
  board.visible = false;
  g.userData.board = board;
  g.add(board);

  return g;
}

function buildDog() {

function createHoverboardMesh() {
  const g = new THREE.Group();
  const boardMat = new THREE.MeshStandardMaterial({ color: 0x00ff88, emissive: 0x00aa55, emissiveIntensity: 0.8, metalness: 0.7, roughness: 0.3 });
  const board = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.08, 1.2), boardMat);
  g.add(board);
  const glow = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.05, 8, 20), new THREE.MeshBasicMaterial({ color: 0x00ffaa }));
  glow.rotation.x = Math.PI / 2; glow.position.y = -0.15;
  g.add(glow);
  return g;
}

/* ==========================================================
   SPAWNING
   ========================================================== */
function randomLane() { return Math.floor(Math.random() * 3); }

function addTrain(lane, color) {
  const m = createTrain(color || (Math.random() < .5 ? 0xe74c3c : 0x2980b9));
  m.position.set(LANES[lane], 0, -110);
  scene.add(m);
  obstacles.push({ mesh: m, type: 'train', length: 12, yBottom: 0, yTop: TRAIN_TOP, lane, zPos: -110 });
}
function addBarrier(lane) {
  const m = createBarrier();
  m.position.set(LANES[lane], 0, -110);
  scene.add(m);
  obstacles.push({ mesh: m, type: 'barrier', length: 1, yBottom: 0, yTop: 1.2, lane, zPos: -110 });
}
function addHighBar(lane) {
  const m = createHighBar();
  m.position.set(LANES[lane], 0, -110);
  scene.add(m);
  obstacles.push({ mesh: m, type: 'highbar', length: 1, yBottom: 1.7, yTop: 2.6, lane, zPos: -110 });
}
function spawnCoinArc(lane, air) {
  if (lane === undefined) lane = randomLane();
  const count = 6 + Math.floor(Math.random() * 3);
  for (let i = 0; i < count; i++) {
    const m = createCoinMesh();
    const y = air ? (6 + Math.sin(i * .5) * 1) : (1.1 + Math.sin(i * .5) * .4);
    m.position.set(LANES[lane], y, -110 - i * 2);
    scene.add(m);
    coins.push({ mesh: m, spin: 0 });
  }
}
function addBoots(lane) {
  const m = createBootsMesh();
  m.position.set(LANES[lane], 1.0, -110);
  scene.add(m);
  powerups.push({ mesh: m, type: 'boots' });
}
function addWings(lane) {
  const m = createWingsMesh();
  m.position.set(LANES[lane], 1.2, -110);
  scene.add(m);
  powerups.push({ mesh: m, type: 'wings' });
}
function addHoverboard(lane) {
  const m = createHoverboardMesh();
  m.position.set(LANES[lane], 0.5, -110);
  scene.add(m);
  powerups.push({ mesh: m, type: 'hoverboard' });
}

function spawnPattern() {
  const r = Math.random();
  // Powerups first
  if (!wingsActive && !hoverboardActive) {
    if (r < 0.02) { addWings(randomLane()); return; }
    if (r < 0.05) { addHoverboard(randomLane()); return; }
    if (r < 0.10 && !bootsActive) { addBoots(randomLane()); return; }
  }
  if (r < 0.20) { spawnCoinArc(); return; }

  // Obstacle patterns - more variety
  const patterns = [
    () => addTrain(randomLane()),
    () => { const free = randomLane(); for (let i = 0; i < 3; i++) if (i !== free) addTrain(i); },
    () => { for (let i = 0; i < 3; i++) addBarrier(i); },
    () => { for (let i = 0; i < 3; i++) addHighBar(i); },
    () => { const l = randomLane(); addTrain(l); addBarrier((l + 1) % 3); },
    () => { const l = randomLane(); addTrain(l); addHighBar((l + 1) % 3); },
    () => { addTrain(randomLane()); addTrain(randomLane()); spawnCoinArc(); },
    () => { addBarrier(0); addHighBar(1); addBarrier(2); },
    () => { addBarrier(randomLane()); addTrain((randomLane() + 1) % 3); },
    () => { for (let i = 0; i < 3; i++) addTrain(i); }, // wall of trains (jump on!)
  ];
  patterns[Math.floor(Math.random() * patterns.length)]();
}

/* ==========================================================
   GAME FLOW
   ========================================================== */
function startGame(isResume) {
  if (!userData) return;
  initAudio();
  document.getElementById('menuScreen').classList.remove('active');
  document.getElementById('overScreen').classList.remove('active');
  document.getElementById('pauseScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');

  initThree();
  resetGameState();

  if (isResume) {
    const s = loadResumeState();
    if (s) { distance = s.distance; gameSpeed = s.gameSpeed; gameCoins = s.gameCoins; }
  }

  setCharacter(userData.currentChar);
  player.position.set(0, 0, PLAYER_Z);
  targetX = 0; currentLane = 1; playerY = 0; playerVY = 0;

  gameRunning = true; gamePaused = false;
  startMusic();
  clock.getDelta();
  updateSkillButton();
  requestAnimationFrame(gameLoop);
}

function resetGameState() {
  obstacles.forEach(o => scene.remove(o.mesh));
  coins.forEach(c => scene.remove(c.mesh));
  powerups.forEach(p => scene.remove(p.mesh));
  particles.forEach(p => scene.remove(p.mesh));
  obstacles = []; coins = []; powerups = []; particles = [];

  distance = 0; gameSpeed = BASE_SPEED; gameCoins = 0;
  playerY = 0; playerVY = 0; isJumping = false; isSliding = false; slideTimer = 0;
  bootsActive = false; bootsTimer = 0;
  wingsActive = false; wingsTimer = 0;
  hoverboardActive = false; hoverboardTimer = 0;
  invincibleTimer = 0;
  skillActiveTimer = 0; skillCooldownTimer = 0; activeSkillEffect = null;
  coinMultiplier = 1;
  timeSlowFactor = 1;
  nextSpawnDistance = 30;
  shakeTime = 0;
  barkTimer = 0;
  updateHUD();
  updateStatusBar();
}

function gameLoop() {
  if (!gameRunning || gamePaused) return;
  gameLoopId = requestAnimationFrame(gameLoop);
  const dt = Math.min(clock.getDelta(), 0.05);
  updateGame(dt);
  renderer.render(scene, camera);
}

function getGroundY() {
  let groundY = 0;
  for (const o of obstacles) {
    if (o.type === 'train') {
      if (Math.abs(o.mesh.position.x - player.position.x) < 1.0 &&
          Math.abs(o.mesh.position.z - PLAYER_Z) < o.length / 2) {
        if (playerY >= TRAIN_TOP - 0.6) {
          groundY = Math.max(groundY, TRAIN_TOP);
        }
      }
    }
  }
  return groundY;
}

function updateGame(dt) {
  const scaledDt = dt * timeSlowFactor;

  // Speed scaling
  gameSpeed = Math.min(BASE_SPEED + distance * SPEED_PER_M, MAX_SPEED);
  distance += gameSpeed * scaledDt * timeSlowFactor;

  // Player X movement
  player.position.x += (targetX - player.position.x) * Math.min(dt * 14, 1);

  // Timers
  if (bootsActive) { bootsTimer -= dt; if (bootsTimer <= 0) { bootsActive = false; updateStatusBar(); } }
  if (wingsActive) { wingsTimer -= dt; if (wingsTimer <= 0) { wingsActive = false; player.userData.wings.visible = false; updateStatusBar(); } }
  if (hoverboardActive) { hoverboardTimer -= dt; if (hoverboardTimer <= 0) { hoverboardActive = false; player.userData.board.visible = false; updateStatusBar(); } }
  if (invincibleTimer > 0) invincibleTimer -= dt;
  if (skillActiveTimer > 0) {
    skillActiveTimer -= dt;
    if (skillActiveTimer <= 0) endSkill();
  }
  if (skillCooldownTimer > 0) { skillCooldownTimer -= dt; if (skillCooldownTimer < 0) skillCooldownTimer = 0; }
  if (isSliding) { slideTimer -= dt; if (slideTimer <= 0) { isSliding = false; player.scale.y = 1; } }

  // Wings flight
  if (wingsActive) {
    playerY += (8 - playerY) * Math.min(dt * 4, 1);
    playerVY = 0;
    isJumping = false;
    if (Math.random() < 0.4) {
      const lane = randomLane();
      const c = createCoinMesh();
      c.position.set(LANES[lane], 6 + Math.random() * 3, -100);
      scene.add(c);
      coins.push({ mesh: c, spin: 0 });
    }
  } else {
    // Physics
    if (isJumping) {
      playerVY -= GRAVITY * dt;
      playerY += playerVY * dt;
      if (playerVY < 0) {
        const groundY = getGroundY();
        if (playerY <= groundY && playerY > groundY - Math.abs(playerVY) * dt - 0.5) {
          playerY = groundY; playerVY = 0; isJumping = false;
        }
      }
    } else if (playerY > 0) {
      const groundY = getGroundY();
      if (playerY > groundY + 0.05) {
        playerVY -= GRAVITY * dt;
        playerY += playerVY * dt;
        if (playerY <= groundY) { playerY = groundY; playerVY = 0; }
      } else if (playerY < groundY) {
        playerY = groundY;
      }
    } else {
      playerY = getGroundY();
    }
  }
  if (hoverboardActive && !wingsActive) playerY += Math.sin(performance.now() * 0.005) * 0.05 + 0.1;
  player.position.y = playerY;

  // Hoverboard visual
  player.userData.board.visible = hoverboardActive;
  player.userData.board.position.set(0, -0.15, 0.1);
  // Wings visual
  player.userData.wings.visible = wingsActive;
  // Aura
  if (skillActiveTimer > 0) {
    player.userData.aura.material.opacity = 0.6 + Math.sin(performance.now() * 0.01) * 0.3;
  } else {
    player.userData.aura.material.opacity = 0;
  }

  // Animate character
  animateCharacter(dt);
  animateDog(dt, scaledDt);

  // Bark sound
  if (gameRunning && !gamePaused) {
    barkTimer -= dt;
    if (barkTimer <= 0) { sfxBark(); barkTimer = 2 + Math.random() * 2; }
  }

  // Move world (obstacles, coins, powerups)
  const move = gameSpeed * scaledDt;
  roadTexture.offset.y = (roadTexture.offset.y - move * 0.04) % 1;

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.mesh.position.z += move;
    if (o.mesh.position.z > 20) { scene.remove(o.mesh); obstacles.splice(i, 1); }
  }
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.mesh.position.z += move;
    c.mesh.rotation.y += dt * 5;
    if (c.mesh.position.z > 20) { scene.remove(c.mesh); coins.splice(i, 1); }
  }
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.mesh.position.z += move;
    p.mesh.rotation.y += dt * 3;
    p.mesh.position.y = (p.type === 'hoverboard' ? 0.5 : 1.0) + Math.sin(performance.now() * 0.003) * 0.2;
    if (p.mesh.position.z > 20) { scene.remove(p.mesh); powerups.splice(i, 1); }
  }

  // Spawn
  if (distance > nextSpawnDistance) {
    spawnPattern();
    const gap = 20 + Math.random() * 18;
    nextSpawnDistance = distance + Math.max(12, gap - distance * 0.02);
  }

  // Collisions - coins
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    const px = player.position.x, py = playerY + 1;
    const attractRadius = (activeSkillEffect === 'magnet') ? 8 : 1.2;
    if (activeSkillEffect === 'magnet') {
      const dx = px - c.mesh.position.x, dy = py - c.mesh.position.y, dz = 0 - c.mesh.position.z;
      const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (d < attractRadius) {
        c.mesh.position.x += dx * dt * 8;
        c.mesh.position.y += dy * dt * 8;
        c.mesh.position.z += dz * dt * 8;
      }
    }
    if (Math.abs(c.mesh.position.z - PLAYER_Z) < 1.3 &&
        Math.abs(c.mesh.position.x - px) < 1.0 &&
        Math.abs(c.mesh.position.y - py) < 1.5) {
      gameCoins += coinMultiplier;
      sfx('coin');
      spawnCoinBurst(c.mesh.position.x, c.mesh.position.y, c.mesh.position.z);
      scene.remove(c.mesh); coins.splice(i, 1);
    }
  }

  // Collisions - powerups
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    if (Math.abs(p.mesh.position.z - PLAYER_Z) < 1.4 &&
        Math.abs(p.mesh.position.x - player.position.x) < 1.2 &&
        Math.abs(p.mesh.position.y - (playerY + 1)) < 2) {
      if (p.type === 'boots') { bootsActive = true; bootsTimer = 8; sfx('boots'); }
      else if (p.type === 'wings') { wingsActive = true; wingsTimer = 7; sfx('wings'); if (hoverboardActive) { hoverboardActive = false; } }
      else if (p.type === 'hoverboard') { hoverboardActive = true; hoverboardTimer = 20; sfx('board'); }
      updateStatusBar();
      scene.remove(p.mesh); powerups.splice(i, 1);
    }
  }

  // Collisions - obstacles (skip if flying)
  if (!wingsActive && invincibleTimer <= 0) {
    for (const o of obstacles) {
      if (Math.abs(o.mesh.position.x - player.position.x) > 1.1) continue;
      if (Math.abs(o.mesh.position.z - PLAYER_Z) > o.length / 2 + 0.4) continue;

      if (o.type === 'train') {
        if (playerY >= TRAIN_TOP - 0.5) continue;
        const pTop = playerY + (isSliding ? 0.9 : 1.8);
        if (pTop > o.yBottom && playerY < o.yTop) { hitObstacle(); break; }
      } else if (o.type === 'barrier') {
        const pTop = playerY + (isSliding ? 0.9 : 1.8);
        if (playerY < o.yTop && pTop > o.yBottom) { hitObstacle(); break; }
      } else if (o.type === 'highbar') {
        const pTop = playerY + (isSliding ? 0.9 : 1.8);
        if (pTop > o.yBottom && playerY < o.yTop) { hitObstacle(); break; }
      }
    }
  }

  // Camera
  if (shakeTime > 0) {
    shakeTime -= dt;
    camera.position.x = (Math.random() - .5) * 0.5;
    camera.position.y = 5.5 + (Math.random() - .5) * 0.4;
  } else {
    camera.position.x += (0 - camera.position.x) * Math.min(dt * 8, 1);
    camera.position.y += (5.5 - camera.position.y) * Math.min(dt * 8, 1);
  }
  camera.lookAt(player.position.x * 0.3, 1.8 + playerY * 0.3, -12);

  updateHUD();
  updateSkillUI(dt);
}

/* ==========================================================
   ANIMATION
   ========================================================== */
function animateCharacter(dt) {
  const anim = player.userData.anim;
  if (!anim) return;
  const swingSpeed = 8 + gameSpeed * 0.25;
  animTime += dt * swingSpeed;

  if (wingsActive) {
    anim.armL.rotation.x = -0.6;
    anim.armR.rotation.x = -0.6;
    anim.armL.rotation.z = -0.7 + Math.sin(animTime * 0.6) * 0.2;
    anim.armR.rotation.z = 0.7 - Math.sin(animTime * 0.6) * 0.2;
    anim.legL.rotation.x = 0.4 + Math.sin(animTime * 0.5) * 0.1;
    anim.legR.rotation.x = 0.4 - Math.sin(animTime * 0.5) * 0.1;
    anim.bodyGroup.position.y = 0;
  } else if (isSliding) {
    anim.armL.rotation.x = -1.2;
    anim.armR.rotation.x = -1.2;
    anim.armL.rotation.z = 0;
    anim.armR.rotation.z = 0;
    anim.legL.rotation.x = -1.3;
    anim.legR.rotation.x = -1.3;
    anim.bodyGroup.position.y = -0.35;
  } else if (isJumping) {
    anim.armL.rotation.x = -1.8;
    anim.armR.rotation.x = -1.8;
    anim.armL.rotation.z = 0.2;
    anim.armR.rotation.z = -0.2;
    anim.legL.rotation.x = -0.5 + Math.sin(animTime * 0.3) * 0.1;
    anim.legR.rotation.x = 0.5;
    anim.bodyGroup.position.y = 0;
  } else {
    const swing = Math.sin(animTime);
    const swing2 = Math.cos(animTime);
    anim.armL.rotation.x = -swing * 0.9;
    anim.armR.rotation.x = swing * 0.9;
    anim.armL.rotation.z = 0;
    anim.armR.rotation.z = 0;
    anim.legL.rotation.x = swing * 1.0;
    anim.legR.rotation.x = -swing * 1.0;
    anim.bodyGroup.position.y = Math.abs(swing) * 0.08;
    anim.bodyGroup.rotation.z = swing2 * 0.03;
  }
}

function animateDog(dt, scaledDt) {
  if (!dog) return;
  dogAnimTime += dt * (10 + gameSpeed * 0.15);
  const legs = dog.userData.legs;
  const t = dogAnimTime;
  legs[0].rotation.x = Math.sin(t) * 0.8;
  legs[1].rotation.x = -Math.sin(t) * 0.8;
  legs[2].rotation.x = -Math.sin(t) * 0.8;
  legs[3].rotation.x = Math.sin(t) * 0.8;
  dog.userData.tail.rotation.z = Math.sin(t * 0.5) * 0.4;
  // Dog follows player's x
  dog.position.x += (player.position.x - dog.position.x) * Math.min(dt * 4, 1);
  // Dog bobs
  dog.position.y = Math.abs(Math.sin(t * 0.5)) * 0.08 + (wingsActive ? Math.sin(t) * 0.1 : 0);
}

/* ==========================================================
   SKILLS
   ========================================================== */
function activateSkill() {
  if (!gameRunning || gamePaused) return;
  if (skillCooldownTimer > 0 || skillActiveTimer > 0) return;
  const char = CHAR_MAP[userData.currentChar] || CHARACTERS[0];
  const skill = char;

  sfx('skill');
  triggerFlash(char.skillColor);
  spawnSkillBurst();

  skillActiveTimer = skill.duration;
  skillCooldownTimer = skill.cooldown;
  activeSkillEffect = skill.effect;
  invincibleTimer = Math.max(invincibleTimer, skill.duration);

  if (skill.effect === 'destroy' || skill.effect === 'destroy_all') {
    // Destroy all obstacles in front
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      if (o.mesh.position.z < PLAYER_Z && o.mesh.position.z > PLAYER_Z - 40) {
        spawnExplosion(o.mesh.position.x, 1.5, o.mesh.position.z, char.skillColor);
        scene.remove(o.mesh);
        obstacles.splice(i, 1);
        if (skill.effect === 'destroy') break;
      }
    }
  }
  if (skill.effect === 'teleport') {
    distance += 30;
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      if (o.mesh.position.z < PLAYER_Z && o.mesh.position.z > PLAYER_Z - 50) {
        scene.remove(o.mesh); obstacles.splice(i, 1);
      }
    }
  }
  if (skill.effect === 'coins_x3') coinMultiplier = 3;
  if (skill.effect === 'slow') timeSlowFactor = 0.4;
  if (skill.effect === 'speed_boost') { /* speed handled in endSkill */ }
  updateStatusBar();
}

function endSkill() {
  const char = CHAR_MAP[userData.currentChar] || CHARACTERS[0];
  if (char.effect === 'coins_x3') coinMultiplier = 1;
  if (char.effect === 'slow') timeSlowFactor = 1;
  activeSkillEffect = null;
  skillActiveTimer = 0;
}

function updateSkillUI(dt) {
  if (!skillBtnEl) return;
  const cd = skillCooldownTimer;
  const char = CHAR_MAP[userData.currentChar] || CHARACTERS[0];
  const pct = cd > 0 ? (cd / char.cooldown) * 100 : 0;
  document.getElementById('skillCd').style.setProperty('--cd', pct + '%');
  skillBtnEl.disabled = cd > 0 || skillActiveTimer > 0;
}

/* ==========================================================
   VISUAL EFFECTS
   ========================================================== */
function triggerFlash(color) {
  const f = document.getElementById('flash');
  const r = (color >> 16) & 255, g = (color >> 8) & 255, b = color & 255;
  f.style.background = `radial-gradient(circle, rgba(${r},${g},${b},.8), transparent 70%)`;
  f.classList.add('on');
  setTimeout(() => f.classList.remove('on'), 100);
}

function spawnCoinBurst(x, y, z) {
  for (let i = 0; i < 6; i++) {
    const geo = new THREE.SphereGeometry(0.06, 4, 4);
    const mat = new THREE.MeshBasicMaterial({ color: 0xffdd00 });
    const p = new THREE.Mesh(geo, mat);
    p.position.set(x, y, z);
    p.userData.vx = (Math.random() - .5) * 4;
    p.userData.vy = Math.random() * 4 + 1;
    p.userData.vz = (Math.random() - .5) * 4;
    p.userData.life = 0.5;
    scene.add(p);
    particles.push(p);
  }
}

function spawnExplosion(x, y, z, color) {
  for (let i = 0; i < 15; i++) {
    const geo = new THREE.SphereGeometry(0.1 + Math.random() * 0.15, 6, 6);
    const mat = new THREE.MeshBasicMaterial({ color });
    const p = new THREE.Mesh(geo, mat);
    p.position.set(x, y, z);
    const angle = Math.random() * Math.PI * 2;
    const speed = 3 + Math.random() * 6;
    p.userData.vx = Math.cos(angle) * speed;
    p.userData.vy = Math.random() * 6;
    p.userData.vz = Math.sin(angle) * speed;
    p.userData.life = 0.8;
    scene.add(p);
    particles.push(p);
  }
}

function spawnSkillBurst() {
  const char = CHAR_MAP[userData.currentChar] || CHARACTERS[0];
  for (let i = 0; i < 25; i++) {
    const geo = new THREE.SphereGeometry(0.12, 6, 6);
    const mat = new THREE.MeshBasicMaterial({ color: char.skillColor });
    const p = new THREE.Mesh(geo, mat);
    p.position.set(player.position.x, playerY + 1, PLAYER_Z);
    const angle = (i / 25) * Math.PI * 2;
    p.userData.vx = Math.cos(angle) * 5;
    p.userData.vy = 2 + Math.random() * 3;
    p.userData.vz = Math.sin(angle) * 5;
    p.userData.life = 1.0;
    scene.add(p);
    particles.push(p);
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.userData.life -= dt;
    if (p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); continue; }
    p.userData.vy -= 15 * dt;
    p.position.x += p.userData.vx * dt;
    p.position.y += p.userData.vy * dt;
    p.position.z += p.userData.vz * dt;
    const s = p.userData.life;
    p.scale.set(s, s, s);
  }
}

/* ==========================================================
   HIT OBSTACLE
   ========================================================== */
function hitObstacle() {
  if (invincibleTimer > 0) return;
  if (hoverboardActive) {
    // Hoverboard saves you once
    hoverboardActive = false;
    player.userData.board.visible = false;
    invincibleTimer = 1.5;
    shakeTime = 0.3;
    sfx('hit');
    updateStatusBar();
    return;
  }
  shakeTime = 0.5;
  sfx('hit');
  gameRunning = false;
  if (gameLoopId) cancelAnimationFrame(gameLoopId);

  userData.coins += gameCoins;
  const isNew = score > userData.highScore;
  if (isNew) userData.highScore = score;
  userData.totalGames = (userData.totalGames || 0) + 1;
  saveUserData();
  clearResumeState();
  stopMusic();

  document.getElementById('overDistance').textContent = Math.floor(distance);
  document.getElementById('overCoins').textContent = gameCoins;
  document.getElementById('newRecord').classList.toggle('hidden', !isNew);
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('overScreen').classList.add('active');
}

/* ==========================================================
   HUD
   ========================================================== */
function updateHUD() {
  document.getElementById('hudDistance').textContent = Math.floor(distance);
  document.getElementById('hudCoins').textContent = gameCoins;
}
function updateStatusBar() {
  const bar = document.getElementById('statusBar');
  const items = [];
  if (bootsActive) items.push({ cls: 'pill-boots', txt: '👢 BOOTS ' + Math.ceil(bootsTimer) + 's' });
  if (wingsActive) items.push({ cls: 'pill-wings', txt: '🪽 FLY ' + Math.ceil(wingsTimer) + 's' });
  if (hoverboardActive) items.push({ cls: 'pill-board', txt: '🛹 BOARD ' + Math.ceil(hoverboardTimer) + 's' });
  if (skillActiveTimer > 0) {
    const c = CHAR_MAP[userData.currentChar];
    items.push({ cls: 'pill-skill', txt: c.skillIcon + ' ' + c.skillName.split(' ')[0] });
  }
  bar.innerHTML = items.map(i => `<div class="status-pill ${i.cls}">${i.txt}</div>`).join('');
}

/* ==========================================================
   INPUT
   ========================================================== */
function playerAction(a) {
  if (!gameRunning || gamePaused) return;
  if (a === 'left' && currentLane > 0) { currentLane--; targetX = LANES[currentLane]; }
  else if (a === 'right' && currentLane < 2) { currentLane++; targetX = LANES[currentLane]; }
  else if (a === 'jump') {
    if (wingsActive) return;
    if (!isJumping) {
      isJumping = true;
      playerVY = bootsActive ? 22 : JUMP_V;
      isSliding = false; player.scale.y = 1;
      sfx('jump');
    }
  } else if (a === 'slide') {
    if (wingsActive) return;
    // Instant down - cancels jump
    isJumping = false;
    playerVY = 0;
    const groundY = getGroundY();
    playerY = groundY;
    if (!isSliding) {
      isSliding = true; slideTimer = 0.8;
      sfx('slide');
    }
  }
}

document.addEventListener('keydown', e => {
  if (!gameRunning || gamePaused) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') { playerAction('left'); e.preventDefault(); }
  else if (k === 'arrowright' || k === 'd') { playerAction('right'); e.preventDefault(); }
  else if (k === 'arrowup' || k === 'w' || k === ' ') { playerAction('jump'); e.preventDefault(); }
  else if (k === 'arrowdown' || k === 's') { playerAction('slide'); e.preventDefault(); }
  else if (k === 'q' || k === 'shift') { activateSkill(); e.preventDefault(); }
  else if (k === 'escape' || k === 'p') { pauseGame(); }
});

let tX = 0, tY = 0;
document.addEventListener('touchstart', e => {
  if (e.target.closest('button')) return;
  tX = e.touches[0].clientX; tY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener('touchend', e => {
  if (e.target.closest('button')) return;
  const dx = e.changedTouches[0].clientX - tX;
  const dy = e.changedTouches[0].clientY - tY;
  if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
  if (Math.abs(dx) > Math.abs(dy)) playerAction(dx > 0 ? 'right' : 'left');
  else playerAction(dy > 0 ? 'slide' : 'jump');
}, { passive: true });

/* ==========================================================
   PAUSE / RESUME
   ========================================================== */
function pauseGame() {
  if (!gameRunning || gamePaused) return;
  gamePaused = true;
  if (gameLoopId) cancelAnimationFrame(gameLoopId);
  saveResumeState();
  document.getElementById('pauseDistance').textContent = Math.floor(distance);
  document.getElementById('pauseCoins').textContent = gameCoins;
  document.getElementById('pauseScreen').classList.add('active');
  if (customAudio) customAudio.pause(); else stopMusic();
}
function resumeGame() {
  if (!gamePaused) return;
  gamePaused = false; gameRunning = true;
  document.getElementById('pauseScreen').classList.remove('active');
  clock.getDelta();
  startMusic();
  requestAnimationFrame(gameLoop);
}
function quitToMenu() {
  saveUserData();
  gameRunning = false; gamePaused = false;
  if (gameLoopId) cancelAnimationFrame(gameLoopId);
  document.getElementById('pauseScreen').classList.remove('active');
  document.getElementById('overScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('menuScreen').classList.add('active');
  stopMusic();
  refreshMenu();
}

/* ==========================================================
   RESUME STATE
   ========================================================== */
function saveResumeState() {
  if (!currentUser) return;
  localStorage.setItem('sr3d_resume_' + currentUser, JSON.stringify({ distance, gameSpeed, gameCoins }));
}
function loadResumeState() {
  if (!currentUser) return null;
  const s = localStorage.getItem('sr3d_resume_' + currentUser);
  return s ? JSON.parse(s) : null;
}
function clearResumeState() {
  if (!currentUser) return;
  localStorage.removeItem('sr3d_resume_' + currentUser);
}

/* ==========================================================
   RESIZE
   ========================================================== */
function onResize() {
  if (!renderer) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

/* ==========================================================
   PARTICLES IN LOOP - add to updateGame via requestAnimationFrame
   ========================================================== */
const origUpdateGame = updateGame;
updateGame = function(dt) {
  origUpdateGame(dt);
  updateParticles(dt);
};

/* ==========================================================
   SHOP
   ========================================================== */
function openShop() {
  document.getElementById('menuScreen').classList.remove('active');
  document.getElementById('shopScreen').classList.add('active');
  renderCharGrid();
}
function closeShop() {
  document.getElementById('shopScreen').classList.remove('active');
  document.getElementById('menuScreen').classList.add('active');
  refreshMenu();
}
function renderCharGrid() {
  document.getElementById('shopCoins').textContent = userData.coins;
  const grid = document.getElementById('charGrid');
  grid.innerHTML = '';
  CHARACTERS.forEach(char => {
    const owned = userData.unlockedChars.includes(char.id);
    const selected = userData.currentChar === char.id;
    const card = document.createElement('div');
    card.className = 'char-card' + (selected ? ' selected' : '') + (!owned ? ' locked' : '');
    const outfitHex = '#' + char.outfit.toString(16).padStart(6, '0');
    const hairHex = '#' + char.hair.toString(16).padStart(6, '0');
    card.innerHTML = `
      <div class="char-preview" style="background: linear-gradient(135deg, ${outfitHex}, ${hairHex})">${char.name[0]}</div>
      <div class="char-name">${char.name}</div>
      <div class="char-skill">${char.skillIcon} ${char.skillName}</div>
      <div class="char-price ${owned ? 'owned' : ''}">${owned ? (selected ? '✓ DIPAKAI' : 'DIMILIKI') : '🪙 ' + char.price}</div>
    `;
    card.onclick = () => selectChar(char);
    grid.appendChild(card);
  });
}
function selectChar(char) {
  const owned = userData.unlockedChars.includes(char.id);
  if (!owned) {
    if (userData.coins < char.price) { alert('Koin tidak cukup! Butuh 🪙 ' + char.price); return; }
    if (!confirm(`Beli ${char.name} seharga 🪙 ${char.price}?\n\nSkill: ${char.skillName}\n${char.desc}`)) return;
    userData.coins -= char.price;
    userData.unlockedChars.push(char.id);
  }
  userData.currentChar = char.id;
  saveUserData();
  renderCharGrid();
}

/* ==========================================================
   AUTO-SAVE
   ========================================================== */
document.addEventListener('visibilitychange', () => {
  if (document.hidden && gameRunning && !gamePaused) pauseGame();
  if (document.hidden) saveUserData();
});

/* ==========================================================
   AUTH ENTER KEY
   ========================================================== */
document.getElementById('authPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('authUser').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('authPass').focus(); });
</script>
